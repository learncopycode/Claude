# Builds the Zikr iPhone app on a GitHub Mac and uploads it to TestFlight / App Store Connect.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contents of the .p8 file), APPLE_TEAM_ID
# Optional repository variable BUNDLE_ID (default com.learncopycode.zikr).
# Without the secrets the run just says what is missing and stops.
name: iPhone app → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main, claude/eloquent-ride-6vedsv]
    paths: ["zikr/**", "ZikrApp/ios-app/**", ".github/workflows/ios-testflight.yml"]

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.learncopycode.zikr' }}
    steps:
      - name: Check the Apple keys
        id: keys
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APPSTORE_KEY_P8"
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::notice title=Apple keys not set::Add these repository secrets to build the iPhone app:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Use the newest Xcode on the runner
        if: steps.keys.outputs.ready == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Make the Xcode project
        if: steps.keys.outputs.ready == 'true'
        run: ZikrApp/ios-app/scripts/prepare-ios.sh

      - name: Build, sign and upload to App Store Connect
        if: steps.keys.outputs.ready == 'true'
        working-directory: ZikrApp/ios-app
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-upload.sh

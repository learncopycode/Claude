<style>
/* NoteTok v2 · notes in the Google Keep style, read as a swipeable feed of posts.
   Layout: one screen at a time (home grid · post feed · editor · review · mind map), each fixed full-screen. */
:root {
  /* dark first (Keep's dark), light below */
  --bg: #202124; --surface: #2d2e31; --raise: #35363a; --line: #5f6368; --soft-line: #3c4043;

  --bg: #ffffff; --surface: #f1f3f4; --raise: #ffffff; --line: #e0e0e0; --soft-line: #eceff1;
  --text: #202124; --muted: #5f6368; --faint: #80868b; --accent: #1a73e8; --on-accent: #ffffff;
  --danger: #d93025; --good: #188038; --star: #f9ab00;
  --coral: #faafa8; --peach: #f39f76; --sand: #fff8b8; --mint: #e2f6d3; --sage: #b4ddd3;
  --fog: #d4e4ed; --storm: #aeccdc; --dusk: #d3bfdb; --blossom: #f6e2dd; --clay: #e9e3d4;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f1f3f4; --raise: #ffffff; --line: #e0e0e0; --soft-line: #eceff1;
  --text: #202124; --muted: #5f6368; --faint: #80868b; --accent: #1a73e8; --on-accent: #ffffff;
  --danger: #d93025; --good: #188038; --star: #f9ab00;
  --coral: #faafa8; --peach: #f39f76; --sand: #fff8b8; --mint: #e2f6d3; --sage: #b4ddd3;
  --fog: #d4e4ed; --storm: #aeccdc; --dusk: #d3bfdb; --blossom: #f6e2dd; --clay: #e9e3d4;
  color-scheme: light; }

html, body { height: 100%; }

  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;

* { box-sizing: border-box; }

.n-mint { --note: var(--mint); } .n-sage { --note: var(--sage); } .n-fog { --note: var(--fog); }
.n-storm { --note: var(--storm); } .n-dusk { --note: var(--dusk); } .n-blossom { --note: var(--blossom); } .n-clay { --note: var(--clay); }

.link-row > span { min-width: 0; flex: 1; }

/* review banner + resurfaced note */
.review-banner { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; margin: 8px 0 4px; padding: 14px 16px;
  border-radius: 14px; background: var(--surface); }

  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--soft-line) 0); }

  label: '<path d="M4 6v5.5L12.5 20l7-7L11 4H6a2 2 0 0 0-2 2z"/><circle cx="8" cy="8" r="1.2"/>',

  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',

  edit: '<path d="M5 19h4L19 9l-4-4L5 15z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',
  copy: '<rect x="8" y="8" width="11" height="12" rx="1.5"/><path d="M5 16V5.5A1.5 1.5 0 0 1 6.5 4H15"/>',
  globe: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',

const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const DAY = 864e5;
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d; };
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const uid = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= storage =================
   Notes in IndexedDB (falls back to localStorage, then to memory); settings in localStorage. */
const COLORS = ["", "coral", "peach", "sand", "mint", "sage", "fog", "storm", "dusk", "blossom", "clay"];
let NOTES = [];
const S = Object.assign({ name: "", layout: "grid", reviewSize: 5, theme: "auto", streak: { day: "", n: 0 }, today: null, seeded: false }, (() => { try { return JSON.parse(localStorage.getItem("nt2.settings")) || {}; } catch (e) { return {}; } })());
const saveS = () => { try { localStorage.setItem("nt2.settings", JSON.stringify(S)); } catch (e) {} };
let idb = null;
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("notetok2", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("notes", { keyPath: "id" });
      r.onsuccess = () => { idb = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
}
async function loadNotes() {
  await openDB();
  if (idb) {
    NOTES = await new Promise(res => { try { const q = idb.transaction("notes").objectStore("notes").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } });
  } else { try { NOTES = JSON.parse(localStorage.getItem("nt2.notes")) || []; } catch (e) { NOTES = []; } }
}
function persist(n, touch = true) {
  if (touch) n.updatedAt = Date.now();
  if (!NOTES.includes(n)) NOTES.push(n);
  if (idb) { try { idb.transaction("notes", "readwrite").objectStore("notes").put(n); return; } catch (e) {} }
  try { localStorage.setItem("nt2.notes", JSON.stringify(NOTES)); } catch (e) {}
}
function removeNote(n) {
  NOTES = NOTES.filter(x => x !== n);
  for (const o of NOTES) if (o.links) o.links = o.links.filter(l => l.to !== n.id);
  if (idb) { try { idb.transaction("notes", "readwrite").objectStore("notes").delete(n.id); return; } catch (e) {} }
  try { localStorage.setItem("nt2.notes", JSON.stringify(NOTES)); } catch (e) {}
}
function makeNote(o = {}) {
  const now = Date.now();
  return Object.assign({ id: uid(), title: "", body: "", items: null, images: [], color: "", pinned: false, archived: false, labels: [],
    createdAt: now, updatedAt: now, liked: false, thoughts: [], links: [], review: { stage: 0, due: startOfDay(now) + DAY, seen: 0 } }, o);
}

/* ================= smart resurfacing =================
   Each note comes back after growing gaps (1, 3, 7, 16, 35, 90 days) like flashcards.
   "Remembered" moves it to the next gap; "Again" brings it back tomorrow.
   The daily review is a short, finite set: notes that are due, topped up with notes you haven't seen for longest. */
const GAPS = [1, 3, 7, 16, 35, 90];
function reviewed(n, remembered) {
  const st = remembered ? Math.min((n.review?.stage ?? 0) + 1, GAPS.length - 1) : 0;
  n.review = { stage: st, due: startOfDay(Date.now()) + GAPS[remembered ? st : 0] * DAY, seen: Date.now() };
  persist(n, false);
}
const live = () => NOTES.filter(n => !n.archived);
function todaysReview() {
  const k = dayKey();
  if (!S.today || S.today.day !== k) {
    const end = startOfDay(Date.now()) + DAY, size = S.reviewSize || 5;
    const due = live().filter(n => (n.review?.due ?? 0) < end).sort((a, b) => (a.review?.due ?? 0) - (b.review?.due ?? 0));
    const ids = due.slice(0, size).map(n => n.id);
    if (ids.length < size) {
      const old = live().filter(n => !ids.includes(n.id) && Date.now() - n.createdAt > 2 * DAY)
        .sort((a, b) => (a.review?.seen || a.createdAt) - (b.review?.seen || b.createdAt));
      for (const n of old) { if (ids.length >= size) break; ids.push(n.id); }
    }
    S.today = { day: k, ids, done: [] }; saveS();
  }
  const ids = S.today.ids.filter(id => NOTES.some(n => n.id === id && !n.archived));
  return { ids, done: S.today.done.filter(id => ids.includes(id)) };
}
function resurfaced() {   // one older note to bring back on the home screen
  const r = todaysReview(), left = r.ids.filter(id => !r.done.includes(id));
  const n = NOTES.find(x => x.id === (left[0] || r.ids[0]));
  return n && Date.now() - n.createdAt > DAY ? n : null;
}
function ago(t) {
  const d = Math.round((startOfDay(Date.now()) - startOfDay(t)) / DAY);
  if (d <= 0) return "Today"; if (d === 1) return "Yesterday"; if (d < 7) return `${d} days ago`;
  if (d < 30) return `${Math.round(d / 7)} week${d < 11 ? "" : "s"} ago`; if (d < 365) return `${Math.round(d / 30)} month${d < 45 ? "" : "s"} ago`;
  return `${Math.round(d / 365)} year${d < 545 ? "" : "s"} ago`;
}
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

/* ================= text helpers ================= */
const URL_RE = /\bhttps?:\/\/[^\s<>"')]+/gi;
function linkify(text) {
  return esc(text).replace(/\bhttps?:\/\/[^\s<&"')]+/gi, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function linksOf(n) {
  const all = [n.body, ...(n.items || []).map(i => i.text)].join("\n").match(URL_RE) || [];
  return [...new Set(all)].slice(0, 3).map(u => {
    let host = u; try { host = new URL(u).hostname.replace(/^www\./, ""); } catch (e) {}
    const yt = /(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(u);
    return { url: u, host, title: yt ? "YouTube video" : (host.split(".").slice(-2, -1)[0] || host).replace(/^./, c => c.toUpperCase()), thumb: yt ? `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` : "" };
  });
}
const linkRowHTML = l => `<a class="link-row" href="${esc(l.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
  <span class="lg">${l.thumb ? `<img src="${esc(l.thumb)}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('${ic("globe").replace(/"/g, "&quot;")}'))">` : ic("globe")}</span>
  <span><b>${esc(l.title)}</b><small>${esc(l.host)}</small></span></a>`;
const noteText = n => [n.title, n.body, ...(n.items || []).map(i => i.text), ...(n.labels || []), ...(n.thoughts || []).map(t => t.text)].join(" ").toLowerCase();
const allLabels = () => [...new Set(NOTES.flatMap(n => n.labels || []))].sort((a, b) => a.localeCompare(b));
const initial = () => (S.name || "Me").trim().charAt(0).toUpperCase();
const isEmpty = n => !n.title.trim() && !n.body.trim() && !(n.items || []).some(i => i.text.trim()) && !n.images.length;

/* ================= toast ================= */
let toastT;
function toast(msg) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);

/* ================= home ================= */
const ui = { view: "notes", label: null, q: "" };
function cardHTML(n) {
  const links = linksOf(n), img = n.images[0];
  const items = n.items ? n.items.slice(0, 8) : null;
  return `<div class="card ${n.color ? "n-" + n.color : ""}" role="button" tabindex="0" data-open="${n.id}">

      : n.body ? `<div class="body">${esc(n.body)}</div>` : ""}
    ${n.labels.length ? `<div class="chips">${n.labels.slice(0, 4).map(l => `<span class="chip">${esc(l)}</span>`).join("")}</div>` : ""}
    ${n.liked || n.thoughts.length ? `<div class="meta">${n.liked ? "♥" : ""}${n.thoughts.length ? `<span>💬 ${n.thoughts.length}</span>` : ""}</div>` : ""}
    ${links.length ? links.slice(0, 2).map(linkRowHTML).join("") : ""}

}

  let list = NOTES.filter(n => ui.view === "archive" ? n.archived : !n.archived);
  if (ui.label) list = list.filter(n => n.labels.includes(ui.label));
  const q = ui.q.trim().toLowerCase();

}

  const list = visibleNotes(), pinned = list.filter(n => n.pinned), others = list.filter(n => !n.pinned);

  const cols = S.layout === "list" ? "masonry list" : "masonry";
  const title = ui.view === "archive" ? "Archive" : ui.label ? ui.label : "";
  return `${title ? `<div class="sec-label" style="font-size:15px;color:var(--text);margin-top:10px">${esc(title)}</div>` : ""}
      ${ui.view === "notes" && !ui.q && !ui.label && r.ids.length ? `<button class="review-banner" data-act="review">
        <span class="ring" style="--p:${Math.round((r.done.length / r.ids.length) * 100)}"><span>${left || "✓"}</span></span>
        <span><b>${left ? "Daily review" : "Review done"}</b><small>${left ? `${left} note${left === 1 ? "" : "s"} to look back on today` : "See you tomorrow"}${S.streak.n > 1 ? ` · ${S.streak.n}-day streak` : ""}</small></span>
        <span class="go">${left ? "Start" : "Again"}</span></button>` : ""}
      ${sur ? `<div class="resurface"><div class="sec-label">${ic("review", "i").replace('class="i"', 'class="i" style="width:16px;height:16px"')} From ${esc(ago(sur.createdAt).toLowerCase())}</div><div class="${cols}">${cardHTML(sur)}</div></div>` : ""}
      ${list.length ? `
        ${pinned.length ? `<div class="sec-label">Pinned</div><div class="${cols}">${pinned.map(cardHTML).join("")}</div>` : ""}
        ${others.length ? `${pinned.length ? `<div class="sec-label">Others</div>` : `<div style="height:8px"></div>`}<div class="${cols}">${others.map(cardHTML).join("")}</div>` : ""}`
      : `<div class="empty">${ic(ui.view === "archive" ? "archive" : "bulb")}<span>${ui.q ? "No matching notes" : ui.view === "archive" ? "Your archived notes appear here" : "Notes you add appear here"}</span></div>`}`;
}
function renderHome() {
  const app = $("#app");
  const title = ui.view === "archive" ? "Archive" : ui.label ? ui.label : "";
  app.innerHTML = `<section class="screen" id="home">
    <div class="searchbar">
      <button class="ib" data-act="drawer" aria-label="Menu">${ic("menu")}</button>
      <input id="q" type="search" placeholder="${title ? "Search " + esc(title) : "Search your notes"}" value="${esc(ui.q)}" autocomplete="off" enterkeyhint="search">
      <button class="ib" data-act="layout" aria-label="${S.layout === "list" ? "Grid view" : "List view"}">${ic(S.layout === "list" ? "grid" : "rows")}</button>
      <button class="avatar" data-act="settings" aria-label="Settings">${esc(initial())}</button>

      <button class="ib" data-act="new-list" aria-label="New list">${ic("check")}</button>
      <button class="ib" data-act="feed" aria-label="Swipe through notes">${ic("feed")}</button>
      <button class="ib" data-act="map" aria-label="Mind map">${ic("map")}</button>
      <button class="ib" data-act="new-image" aria-label="New note with image">${ic("image")}</button>
    </nav>
    <button class="fab" data-act="new" aria-label="New note"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-linecap="round"><path class="p1" d="M12 5v14"/><path class="p2" d="M5 12h14"/></svg></button>` : ""}
  </section>`;

/* ================= drawer + settings ================= */
function openDrawer() {
  const labels = allLabels(), r = todaysReview();
  $("#layer").insertAdjacentHTML("beforeend", `<div class="scrim" data-act="close-layer"></div><nav class="drawer" aria-label="Menu">
    <div class="brand">NoteTok<small>v2</small></div>
    <button class="${ui.view === "notes" && !ui.label ? "on" : ""}" data-act="go-notes">${ic("bulb")}Notes</button>
    <button data-act="review">${ic("review")}Daily review<span class="n">${r.ids.length - r.done.length || ""}</span></button>

function readImage(file) {

    r.onload = () => { const img = new Image(); img.onload = () => {

      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .85)); }; img.onerror = () => res(null); img.src = r.result; };

/* ================= mind map: what your mind is occupied with =================

      similarity, rare shared words count more than common ones). Strong matches become links, thicker when closer.
   2. Shared labels always link.
   3. "Ask Claude" reads the notes for meaning (not just shared words), weighs each link 1-3, groups notes into
      themes and writes what it notices. Claude's links and themes replace the guesses from step 1 until notes change.
   Attention ("heat"): how much you've touched a note lately (edits, thoughts, likes, reviews), fading over ~2 weeks.
   It sets each note's size and glow, and each theme's share of your mind. */
const STOP = new Set("a an the and or but if then so of to in on at by for with from as is are was were be been being it its this that these those i me my we our you your he she they them his her their not no yes do does did have has had will would can could should just very really more most some any all there here what when where which who how why also into over under out up down about than too only own same such both each few other again further once am im ive dont cant wont lets get got make made one two new like need use via www http https com".split(" "));

  cv.onwheel = e => { e.preventDefault(); zoomAt(MM.cam.z * (e.deltaY < 0 ? 1.12 : .89), e.offsetX, e.offsetY); };
  function zoomAt(z, px, py, base = MM.cam) { z = Math.max(.2, Math.min(4, z)); const wx = (px - W() / 2 - base.x) / base.z, wy = (py - H() / 2 - base.y) / base.z; MM.cam = { x: px - W() / 2 - wx * z, y: py - H() / 2 - wy * z, z }; }
  MM.zoomAt = zoomAt; MM.W = W; MM.H = H; MM.byId = byId;
  MM.fit = (only) => { const vis = (only || nodes).filter(visible); if (!vis.length) return; const xs = vis.map(o => o.x), ys = vis.map(o => o.y); const w = Math.max(...xs) - Math.min(...xs) + 200, h = Math.max(...ys) - Math.min(...ys) + 170;
    const z = Math.max(.2, Math.min(1.7, Math.min(W() / w, H() / h))); MM.cam = { z, x: -(Math.max(...xs) + Math.min(...xs)) / 2 * z, y: -(Math.max(...ys) + Math.min(...ys)) / 2 * z }; };
  setTimeout(() => MM && MM.fit(), 1100);
}
function openNodeFeed(id) { const ids = live().sort((a, b) => b.updatedAt - a.updatedAt).map(n => n.id); openFeed(ids, ids.indexOf(id)); }
function focusNode(o) {
  MM.focus = o; const card = $("#node-card"); if (!card) return;
  if (!o) { card.hidden = true; return; }
  const n = o.n, t = MM.themeOf.get(n.id), conn = MM.edges.filter(e => e.a === o || e.b === o).sort((a, b) => b.w - a.w).slice(0, 3);
  const last = Math.max(n.updatedAt, n.review?.seen || 0, ...(n.thoughts || []).map(x => x.at));
  card.hidden = false;
  card.innerHTML = `<div class="nc-top">${t ? `<span class="nc-theme" style="--tc:${t.color}">${esc(t.name)}</span>` : ""}<span class="muted">last touched ${esc(ago(last).toLowerCase())}</span></div>
    <b>${esc(n.title || (n.body || "").split("\n")[0] || "Untitled")}</b>
    ${conn.length ? `<div class="nc-conn">${conn.map(e => { const other = e.a === o ? e.b : e.a; return `<button data-act="map-jump" data-id="${other.n.id}"><span class="bar" style="--w:${Math.round(e.w * 100)}%"></span>${esc(other.n.title || "Untitled")}<small>${esc(e.why || "")}</small></button>`; }).join("")}</div>` : `<p class="muted" style="margin:0;font-size:13px">Not connected to anything yet.</p>`}
    <div class="row-btns"><button class="btn" data-act="map-open" data-id="${n.id}">Open</button>${MM.mind.forgotten.has(n.id) || last < Date.now() - 10 * DAY ? `<button class="btn ghost" data-act="map-bring" data-id="${n.id}">Bring back tomorrow</button>` : ""}</div>`;
}
function renderMindChips() {
  const box = $("#mind-chips"); if (!box || !MM) return;
  const m = MM.mind, arrow = t => t === "up" ? "↑" : t === "down" ? "↓" : "";
  box.innerHTML = `<span class="mc-h">On your mind</span>
    ${m.themes.map(t => `<button class="mc ${MM.theme === t ? "on" : ""}" data-act="map-theme" data-name="${esc(t.name)}" style="--tc:${t.color}"><i></i>${esc(t.name)} <b>${Math.round(t.share * 100)}%</b>${arrow(t.trend) ? `<em class="${t.trend}">${arrow(t.trend)}</em>` : ""}</button>`).join("") || `<span class="muted" style="font-size:13px">Add a few related notes to see themes</span>`}
    ${m.loops.length ? `<button class="mc ${MM.show === "loops" ? "on" : ""}" data-act="map-show" data-k="loops" style="--tc:var(--danger)"><i></i>Open loops <b>${m.loops.length}</b></button>` : ""}
    ${m.forgotten.size ? `<button class="mc ${MM.show === "forgotten" ? "on" : ""}" data-act="map-show" data-k="forgotten" style="--tc:var(--star)"><i></i>Forgotten <b>${m.forgotten.size}</b></button>` : ""}
    ${S.mind?.insights?.length ? `<button class="mc" data-act="map-insights" style="--tc:var(--accent)"><i></i>Insights</button>` : ""}`;
}
function closeMap() { if (MM) MM.running = false; MM = null; const el = $("#map-screen"); if (!el) return; el.classList.add("out"); setTimeout(() => el.remove(), 200); }
function openInsights() {
  const m = S.mind; if (!m) return;
  $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"></div><div class="sheet" role="dialog" aria-label="What Claude noticed">
    <h3>What Claude noticed</h3><p class="muted" style="margin:-6px 0 0;font-size:13px">From your notes on ${esc(fmtDate(m.at))}</p>
    ${(m.themes || []).map((t, k) => `<div class="ins-theme"><span style="--tc:${(MM?.mind.themes.find(x => x.name === t.name) || {}).color || THEME_COLORS[k % THEME_COLORS.length]}"></span><div><b>${esc(t.name)}</b><p>${esc(t.summary || "")}</p></div></div>`).join("")}
    ${(m.insights || []).length ? `<ul class="ins">${m.insights.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${m.nextStep ? `<div class="ins-next"><b>A next step</b><p>${esc(m.nextStep)}</p></div>` : ""}
    <button class="btn ghost" data-act="close-layer">Close</button></div>`;
}
async function mapAI() {
  const btn = document.querySelector('[data-act="map-ai"]'), notes = live(); if (notes.length < 2) { toast("Add at least two notes first"); return; }
  const sample = await sampler();
  if (!sample) { toast("Claude isn't available here. Links come from the words your notes share"); return; }
  btn.innerHTML = '<span class="busy"></span> Reading…';
  try {
    const digest = notes.slice(0, 120).map(n => ({ id: n.id, title: n.title, text: (n.body || (n.items || []).map(i => (i.done ? "[x] " : "[ ] ") + i.text).join("; ")).slice(0, 400), labels: n.labels, thoughts: (n.thoughts || []).map(t => t.text).slice(-3), created: fmtDate(n.createdAt), lastTouched: ago(n.updatedAt) }));
    const out = await sample.json(`You map a person's personal notes so they can see what their mind is occupied with. Judge relatedness by MEANING (same goal, project, person, worry, idea or topic), not by shared words.
Return JSON only:
{"themes": [{"name": "1-2 word theme", "ids": ["note ids"], "summary": "one sentence on what this theme is about for them"}],
 "links": [{"a": "<id>", "b": "<id>", "strength": 1|2|3, "why": "max 4 words"}],
 "insights": ["3 short, specific observations: what they keep returning to, what connects unexpectedly, what is unfinished or forgotten"],
 "nextStep": "one concrete, gentle suggestion, e.g. merge notes, finish a list, revisit something"}
Rules: 2-7 themes, every note in at most one theme; strength 3 = clearly the same thing, 1 = loosely related; at most ${Math.min(notes.length * 2, 40)} links; never invent facts that are not in the notes; write plainly and kindly.

NOTES:
${JSON.stringify(digest)}`);
    const ids = new Set(notes.map(n => n.id));
    for (const n of notes) n.links = [];
    let k = 0;
    for (const l of Array.isArray(out?.links) ? out.links : []) if (ids.has(l.a) && ids.has(l.b) && l.a !== l.b) { NOTES.find(n => n.id === l.a).links.push({ to: l.b, why: String(l.why || "").slice(0, 32), strength: Math.max(1, Math.min(3, +l.strength || 2)) }); k++; }
    notes.forEach(n => persist(n, false));
    S.mind = { at: Date.now(), themes: (out?.themes || []).map(t => ({ name: String(t.name || "Theme").slice(0, 24), ids: (t.ids || []).filter(id => ids.has(id)), summary: String(t.summary || "").slice(0, 200) })).filter(t => t.ids.length),
      insights: (out?.insights || []).map(String).slice(0, 4), nextStep: String(out?.nextStep || "") };
    saveS(); MM?.rebuild(); openInsights();
  } catch (e) { toast(e?.code === "not_granted" ? "Claude wasn't allowed. Links come from shared words" : "Couldn't read your notes right now"); }
  if (btn.isConnected) btn.innerHTML = "✨ Ask Claude";
}

/* ================= import / export / examples ================= */
async function importV1() {
  try {
    const db1 = await new Promise((res, rej) => { const r = indexedDB.open("notetok"); r.onsuccess = () => res(r.result); r.onerror = () => rej(); r.onupgradeneeded = () => { r.transaction.abort(); rej(); }; });
    const v1 = await new Promise(res => { try { const q = db1.transaction("notes").objectStore("notes").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } });
    let k = 0;
    for (const o of v1) {
      if (NOTES.some(n => n.v1 === o.id)) continue;
      const body = [o.summary, ...(o.keyPoints || []).map(p => "• " + p), o.text && o.text !== o.summary ? o.text : ""].filter(Boolean).join("\n");
      persist(makeNote({ v1: o.id, title: o.title || "", body, images: o.image ? [o.image] : [], labels: o.tags || [], liked: !!o.liked, createdAt: o.createdAt || Date.now() })); k++;
    }
    closeLayer(); renderHome(); toast(k ? `Imported ${k} note${k === 1 ? "" : "s"} from v1` : "No v1 notes found on this device");
  } catch (e) { closeLayer(); toast("No v1 notes found on this device"); }
}
async function exportNotes() {
  const blob = new Blob([JSON.stringify({ app: "NoteTok", version: 2, exportedAt: new Date().toISOString(), notes: NOTES }, null, 1)], { type: "application/json" });
  const name = `notetok-backup-${dayKey()}.json`;
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data: blob }); } catch (e) {} return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function seedExamples() {
  // Example notes so the app opens in a working state; Settings can remove them.
  const d = n => Date.now() - n * DAY;
  const ex = (o, ageDays) => makeNote(Object.assign({ example: true, createdAt: d(ageDays), updatedAt: d(Math.max(0, ageDays - 1)), review: { stage: 0, due: startOfDay(d(ageDays)) + DAY, seen: 0 } }, o));
  NOTES = [
    ex({ title: "Next read", body: "Summerscales et al., Science 311 (2006) 829\nJ. Am. Chem. Soc. 128 (2006)", pinned: true, labels: ["reading"] }, 21),
    ex({ title: "Groceries", items: ["Dates", "Milk", "Basmati rice", "Lentils", "Green chillies"].map((t, i) => ({ id: uid(), text: t, done: i === 1 })), color: "sand" }, 2),
    ex({ title: "How ancient knowledge survived", body: "Watch later\nhttps://youtube.com/shorts/fNiOPVPHq_s", labels: ["reading", "history"], color: "storm",
         thoughts: [{ at: d(9), text: "Ask about the libraries of Baghdad." }] }, 12),
    ex({ title: "Calls this week", items: ["Ismat", "Andrew", "Mahfuz after maghrib"].map(t => ({ id: uid(), text: t, done: false })), labels: ["people"] }, 5),
    ex({ title: "Teach normal islamic things", body: "Start with salah, then small duas for daily life. Keep it short and kind.", labels: ["family"], color: "sage", liked: true }, 40),
    ex({ title: "Flat budget", body: "Gulshan 60,000\nEskaton 42,000\nDifference 18,000 a month", labels: ["money"] }, 8),
  ];
  NOTES[2].links = [{ to: NOTES[0].id, why: "reading list" }];
  NOTES.forEach(n => persist(n, false)); S.seeded = true; saveS();
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const card = e.target.closest("[data-open]");
  if (card) { const ids = visibleNotes().map(n => n.id); const id = card.dataset.open; const list = ids.includes(id) ? ids : [id, ...ids]; openFeed(list, list.indexOf(id)); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, n = b.dataset.id ? NOTES.find(x => x.id === b.dataset.id) : null;
  switch (act) {
    case "drawer": openDrawer(); break;
    case "close-layer": closeLayer(); break;
    case "layout": S.layout = S.layout === "list" ? "grid" : "list"; saveS(); renderHome(); break;
    case "settings": openSettings(); break;
    case "set-size": S.reviewSize = +b.dataset.k; S.today = null; saveS(); openSettings(); renderHome(); break;
    case "set-theme": S.theme = b.dataset.k; saveS(); applyTheme(); openSettings(); break;
    case "go-notes": ui.view = "notes"; ui.label = null; closeLayer(); renderHome(); break;
    case "go-archive": ui.view = "archive"; ui.label = null; closeLayer(); renderHome(); break;
    case "go-label": ui.view = "notes"; ui.label = b.dataset.l; closeLayer(); renderHome(); break;
    case "new": { const m = makeNote(); openEditor(m, true); break; }
    case "new-list": { const m = makeNote({ items: [{ id: uid(), text: "", done: false }] }); openEditor(m, true); break; }
    case "new-image": imgTarget = "new"; $("#img-input").click(); break;
    case "feed": { const ids = visibleNotes().map(x => x.id); openFeed(ids, 0); break; }
    case "review": { const r = todaysReview(); let ids = r.ids.filter(id => !r.done.includes(id)); if (!ids.length) ids = r.ids; openFeed(ids, 0, "review"); break; }
    case "close-feed": closeFeed(); break;
    case "rv-ok": reviewAnswer(true); break;
    case "rv-again": reviewAnswer(false); break;
    case "like": n.liked = !n.liked; persist(n, false); refreshPost(n); break;
    case "pin": n.pinned = !n.pinned; persist(n, false); refreshPost(n); toast(n.pinned ? "Pinned" : "Unpinned"); break;
    case "think": document.getElementById("th-" + n.id)?.focus(); break;
    case "share": shareImage(n); break;
    case "edit": openEditor(n); break;
    case "post-more": { const p = currentPost(); const m = p && NOTES.find(x => x.id === p.dataset.id); if (!m) break;
      $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"></div><div class="sheet menu" role="dialog" aria-label="Note actions">
        <button data-act="edit" data-id="${m.id}">${ic("edit")}Edit</button><button data-act="pin" data-id="${m.id}">${ic("pin")}${m.pinned ? "Unpin" : "Pin"}</button>
        <button data-act="post-archive" data-id="${m.id}">${ic("archive")}${m.archived ? "Unarchive" : "Archive"}</button><button data-act="share" data-id="${m.id}">${ic("share")}Share as image</button>
        <button class="danger" data-act="post-delete" data-id="${m.id}">${ic("trash")}Delete</button></div>`; break; }
    case "post-archive": n.archived = !n.archived; persist(n); closeLayer(); closeFeed(); toast(n.archived ? "Note archived" : "Note unarchived"); break;
    case "post-delete": removeNote(n); closeLayer(); closeFeed(); toast("Note deleted"); break;
    case "ed-close": closeEditor(); break;
    case "ed-pin": ed.n.pinned = !ed.n.pinned; edSave(true); renderEditor(); break;
    case "ed-archive": ed.n.archived = !ed.n.archived; edSave(true); toast(ed.n.archived ? "Note archived" : "Note unarchived"); closeEditor(); if (feedCtx) closeFeed(); break;
    case "ed-remind": openRemindSheet(); break;
    case "remind": setRemind(startOfDay(Date.now()) + +b.dataset.d * DAY); break;
    case "ed-panel": ed.panel = ed.panel === b.dataset.p ? null : b.dataset.p; renderEditor(); break;
    case "ed-color": ed.n.color = b.dataset.c; edSave(true); renderEditor(); break;
    case "ed-add-image": imgTarget = "editor"; $("#img-input").click(); break;
    case "ed-img-del": ed.n.images.splice(+b.dataset.i, 1); edSave(true); renderEditor(); break;
    case "ed-toggle-list": { const m = ed.n;
      if (m.items) { m.body = m.items.map(i => i.text).filter(Boolean).join("\n"); m.items = null; }
      else { m.items = (m.body || "").split("\n").filter(s => s.trim()).map(t => ({ id: uid(), text: t.replace(/^[-•*]\s*/, ""), done: false })); if (!m.items.length) m.items = [{ id: uid(), text: "", done: false }]; m.body = ""; }
      ed.panel = null; edSave(true); renderEditor(); break; }
    case "ed-add-item": addItem(null); break;
    case "ed-del-item": delItem(b.closest(".ed-item").dataset.item); break;
    case "ed-label": ed.panel = null; renderEditor(); openLabelSheet(); break;
    case "lbl-toggle": { const l = b.dataset.l, m = ed.n; m.labels = m.labels.includes(l) ? m.labels.filter(x => x !== l) : [...m.labels, l]; edSave(true); openLabelSheet(); renderEditor(); break; }
    case "ed-copy": { const c = makeNote(JSON.parse(JSON.stringify({ ...ed.n, id: undefined, createdAt: undefined, updatedAt: undefined, example: undefined }))); c.id = uid(); c.createdAt = c.updatedAt = Date.now(); persist(c); toast("Copy made"); ed.panel = null; renderEditor(); break; }
    case "ed-share": shareImage(ed.n); break;
    case "ed-delete": { const m = ed.n; removeNote(m); const el = $("#editor"); el?.remove(); ed = null; if (feedCtx) closeFeed(); else renderHome(); toast("Note deleted"); break; }
    case "ed-ai": aiTidy(); break;
    case "map": openMap(); break;
    case "close-map": closeMap(); break;
    case "map-zoom": MM?.zoomAt(MM.cam.z * +b.dataset.z, MM.W() / 2, MM.H() / 2); break;
    case "map-fit": MM?.fit(); break;
    case "map-ai": mapAI(); break;
    case "map-theme": { const t = MM.mind.themes.find(x => x.name === b.dataset.name); MM.theme = MM.theme === t ? null : t; MM.show = null; focusNode(null); renderMindChips(); if (MM.theme) MM.fit(MM.theme.ids.map(id => MM.byId.get(id)).filter(Boolean)); else MM.fit(); break; }
    case "map-show": MM.show = MM.show === b.dataset.k ? null : b.dataset.k; MM.theme = null; focusNode(null); renderMindChips(); break;
    case "map-insights": openInsights(); break;
    case "map-open": openNodeFeed(b.dataset.id); break;
    case "map-jump": { const o = MM.byId.get(b.dataset.id); if (o) { focusNode(o); MM.cam = { ...MM.cam, x: -o.x * MM.cam.z, y: -o.y * MM.cam.z }; } break; }
    case "map-bring": { n.review = { ...(n.review || {}), due: startOfDay(Date.now()) + DAY }; persist(n, false); toast("Comes back in tomorrow's review"); focusNode(MM.focus); break; }
    case "import-v1": importV1(); break;
    case "export": exportNotes(); break;
    case "del-examples": NOTES.filter(x => x.example).forEach(removeNote); S.today = null; saveS(); closeLayer(); renderHome(); toast("Example notes removed"); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches?.(".card[data-open]")) e.target.click(); });
document.addEventListener("change", e => {
  const cb = e.target.closest("[data-tick]"); if (!cb) return;
  const n = NOTES.find(x => x.id === cb.dataset.tick), it = n?.items?.find(i => i.id === cb.dataset.item); if (!it) return;
  it.done = cb.checked; persist(n, false); cb.closest("label").classList.toggle("done", it.done);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-think-form]"); if (!f) return; e.preventDefault();
  const n = NOTES.find(x => x.id === f.dataset.thinkForm), inp = f.querySelector("input"), v = inp.value.trim(); if (!n || !v) return;
  n.thoughts.push({ at: Date.now(), text: v }); persist(n); refreshPost(n); toast("Thought added");
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#layer").innerHTML) closeLayer(); else if (ed) closeEditor(); else if ($("#map-screen")) closeMap(); else if (feedCtx) closeFeed();
});
// No pinch-zoom of the page on iPhone (the mind map handles its own pinch).
document.addEventListener("gesturestart", e => { if (!e.target.closest?.("#map")) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => { if (!e.target.closest?.("#map")) e.preventDefault(); }, { passive: false });

/* ================= start ================= */
(async function start() {
  applyTheme();
  await loadNotes();
  if (!NOTES.length && !S.seeded) seedExamples();
  renderHome();
  sampler();
})();
</script>

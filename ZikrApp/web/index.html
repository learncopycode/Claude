  top.style.transformOrigin = "50% 50%"; top.style.transition = "transform 0.75s cubic-bezier(.5,-0.2,.6,1), opacity 0.75s ease, border-radius 0.75s";
  top.style.transform = `translate(${dx}px, ${dy}px) scale(0.06) rotate(-8deg)`; top.style.opacity = "0.3"; top.style.borderRadius = "120px";
  sparks(r.left + r.width / 2, r.top + r.height / 2, reflection(p.n).hue);
  setTimeout(() => {
    ui.pending = null; animating = false;
    const t = document.getElementById("tab-refl"); t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse");
    toast("Collected into Reflections", reflection(p.n).label, reflection(p.n).hue);
    if (S.mode === "feed") { const its = counterItems(); ui.counterId = its[(curIndex() + 1) % its.length].id; }
    drawCounter();
  }, 760);
}

/* ================= Overlays ================= */
function closeOverlay(el) { if (!el) return; el.classList.add("out"); setTimeout(() => el.remove(), 280); }
function openReflectionOverlay(n, itemId, tier) {
  const r = reflection(n), it = itemById(itemId), link = sourceLink(r.ref), hlink = sourceLink(r.topicHadith?.ref);
  const el = document.createElement("section"); el.className = "overlay"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", r.label);
  el.setAttribute("style", auroraVars(r.hue, r.hue2));
  el.innerHTML = `<button class="icon-btn close" data-act="closeov" aria-label="Close">${ICONS.close}</button>
    <div class="inner">
      <div class="artbox">${reflectArt(r)}</div>
      <span class="pill"><i></i>Reflection #${n}${it ? ` · ${fmt(tier * REFLECT_EVERY)} × ${esc(it.title)}` : ""}</span>
      <h1>${esc(r.label)}</h1>${r.isName ? `<p class="muted" style="text-align:center;margin:-6px 0 0">${esc(r.subtitle)}</p>` : ""}
      <div class="block">${auroraHTML}<span class="eyebrow">From the Quran</span><div class="ar">${esc(r.ar)}</div><div class="tl">${esc(r.tl)}</div><div class="en">${esc(r.en)}</div>
        <a class="ref" href="${link.url}" target="_blank" rel="noopener">${esc(r.ref)} ↗</a></div>
      ${ORNAMENT}
      <div class="block">${r.isName ? "" : auroraHTML}<span class="eyebrow">${r.isName ? "The Name" : "Name of Allah"}</span><div class="name-ar ar">${esc(r.name.arabic)}</div><b>${esc(r.name.translit)} · ${esc(r.name.meaning)}</b>${r.tie ? `<p class="para muted">${esc(r.tie)}</p>` : ""}</div>
      <div class="block left"><span class="eyebrow">Reflect</span><p class="para">${esc(r.reflect)}</p><p class="para"><b>Today:</b> ${esc(r.prompt)}</p></div>
      ${r.topicHadith ? `<div class="block left"><span class="eyebrow">Hadith</span><p class="para">${esc(r.topicHadith.text)}</p><a class="ref" href="${hlink.url}" target="_blank" rel="noopener">${esc(r.topicHadith.ref)} ↗</a></div>` : ""}
      ${r.wonder ? `<div class="block left">${auroraHTML}<span class="eyebrow">A wonder</span><p class="para">${esc(r.wonder)}</p></div>` : ""}
      ${ORNAMENT}
      <div class="btn-row"><button class="btn" data-act="closeov">Alhamdulillah</button></div>
    </div>`;
  document.body.appendChild(el);
}
function openSource(libId) {
  const s = sourceFor(libId); if (!s) return;
  const link = sourceLink(s.ref), d = BY_ID[libId];
  $layer.insertAdjacentHTML("beforeend", `<div class="scrim" data-act="closesrc" style="z-index:54"></div><div class="sheet-src" role="dialog" aria-label="${s.kind}"><div class="in">
    <span class="eyebrow">${s.kind === "Quran" ? "From the Quran" : "Hadith"} · ${esc(d ? d.title : "")}</span>
    <p>${esc(s.text)}</p><b>${esc(s.ref)}</b>
    <a href="${link.url}" target="_blank" rel="noopener">${link.label} ↗</a>
    <div class="btn-row" style="justify-content:flex-start"><button class="btn small" data-act="closesrc">Back to counting</button></div></div></div>`);
}
function sparks(x, y, hue) {
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 140, size = 4 + Math.random() * 6;
    s.className = "spark"; Object.assign(s.style, { left: x + "px", top: y + "px", width: size + "px", height: size + "px", background: hsb(hue + (i % 3) * 50, 0.6, 0.95) });
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1400);
  }
}
function toast(title, text, hue, ms = 2000) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.setAttribute("style", auroraVars(hue ?? 150));
  t.innerHTML = `<span class="sw"></span><span><b>${esc(title)}</b><span>${esc(text)}</span></span>`;
  document.body.appendChild(t); setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 360); }, ms);
}

/* ================= Add sheet ================= */
const form = { kind: "zikr", title: "", arabic: "", translit: "", translation: "", target: 33, filled: null };
function openAdd() {
  Object.assign(form, { kind: "zikr", title: "", arabic: "", translit: "", translation: "", target: 33, filled: null });
  $layer.insertAdjacentHTML("beforeend", `<div class="scrim" data-act="closeadd"></div><div class="sheet" role="dialog" aria-label="Add a zikr"><div class="in" id="addin"></div></div>`);
  drawAdd(); setTimeout(() => document.getElementById("f-title")?.focus(), 380);
}
function closeAdd() { $layer.querySelectorAll(".scrim, .sheet").forEach(e => e.remove()); }
const unchanged = () => form.filled && form.filled.arabic === form.arabic && form.filled.title === form.title;
function drawAdd() {
  const el = document.getElementById("addin"); if (!el) return;
  const src = form.filled ? sourceFor(form.filled.id) : null;
  el.innerHTML = `
    <div class="top"><button class="textbtn" data-act="closeadd" style="color:var(--muted);font-weight:600">Cancel</button><b>Add to My Zikr</b><button class="textbtn" data-act="save" ${form.title.trim() ? "" : "disabled"}>Add</button></div>
    <div class="seg" role="group" aria-label="Type">${["zikr", "dua"].map(k => `<button data-act="kind" data-kind="${k}" aria-pressed="${form.kind === k}">${k === "zikr" ? "Zikr" : "Dua"}</button>`).join("")}</div>
    <label class="field">${ICONS.search}<input id="f-title" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type in English, e.g. “hasbunallah”" value="${esc(form.title)}"></label>
    <div id="results"></div>
    <label class="field"><textarea id="f-arabic" class="ar" rows="2" dir="rtl" placeholder="النَّصُّ الْعَرَبِيُّ">${esc(form.arabic)}</textarea></label>
    <label class="field"><textarea id="f-translit" rows="2" placeholder="Transliteration">${esc(form.translit)}</textarea></label>
    <label class="field"><textarea id="f-translation" rows="2" placeholder="Meaning in English">${esc(form.translation)}</textarea></label>
    ${src ? `<div class="virtue"><span class="eyebrow">${src.kind === "Quran" ? "From the Quran" : "Hadith"}</span><span>${esc(src.text)}</span><small class="muted">${esc(src.ref)}</small></div>` : ""}
    <div class="eyebrow" style="margin-top:16px">Count per round</div>
    <div class="presets">${[1, 3, 7, 33, 99, 100, 1000].map(n => `<button data-act="preset" data-n="${n}" aria-pressed="${form.target === n}">${n}</button>`).join("")}</div>`;
  const t = document.getElementById("f-title");
  t.oninput = () => { form.title = t.value; drawResults(); el.querySelector('[data-act="save"]').disabled = !form.title.trim(); };
  t.onkeydown = e => { if (e.key === "Enter") { const r = search(form.title)[0]; if (r) fill(r); } };
  for (const [id, key] of [["f-arabic", "arabic"], ["f-translit", "translit"], ["f-translation", "translation"]]) { const f = document.getElementById(id); f.oninput = () => { form[key] = f.value; }; }
  drawResults();
}
function drawResults() {
  const box = document.getElementById("results"); if (!box) return;
  const show = form.title.trim().length >= 2 && (!form.filled || form.filled.title !== form.title), res = show ? search(form.title) : [];
  box.innerHTML = show ? `<div class="results">${res.length ? res.map(d => `<button class="res" data-act="pick" data-id="${d.id}"><span class="rb"><b>${esc(d.title)}</b><span class="ar">${esc(d.arabic)}</span><small>${esc(d.source)}</small></span></button>`).join("") : `<div class="res muted">No verified match yet. Keep typing, or fill in the fields yourself.</div>`}</div>` : "";
}
function fill(d) { Object.assign(form, { title: d.title, arabic: d.arabic, translit: d.translit, translation: d.meaning, target: d.count, filled: d }); drawAdd(); }
function saveAdd() {
  if (!form.title.trim()) return;
  let it;
  if (unchanged()) { it = findOrCreate(form.filled); it.target = form.target; }
  else { it = { id: uid(), title: form.title.trim(), arabic: form.arabic.trim(), translit: form.translit.trim(), translation: form.translation.trim(), source: "", target: form.target, count: 0, rounds: 0, total: 0, libraryID: null, createdAt: Date.now() }; S.items.push(it); }
  it.updated = Date.now(); save(); closeAdd(); ui.tab = "home"; ui.sub = null; render(); openCounter(it.id);
}

/* ================= Events ================= */
function rerenderKeepScroll() { const y = $screen.scrollTop; render(); $screen.scrollTop = y; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case "tab": if ($counter) closeCounter(); document.querySelectorAll(".overlay").forEach(closeOverlay); ui.tab = b.dataset.tab; ui.sub = null; render(true); $screen.scrollTop = 0; break;
    case "sub": ui.tab = "discover"; ui.sub = b.dataset.sub; render(true); $screen.scrollTop = 0; break;
    case "theme": S.theme = isLight() ? "dark" : "light"; save(); applyTheme(); rerenderKeepScroll(); break;
    case "open": openCounter(id); break;
    case "lib": openCounter(findOrCreate(BY_ID[id]).id); break;
    case "quickadd": {
      const d = BY_ID[id]; if (added(d)) toast("Already in My Zikr", d.title); else { findOrCreate(d).updated = Date.now(); save(); toast("Added to My Zikr", d.title); }
      rerenderKeepScroll(); break;
    }
    case "addall": { let n = 0; for (const d of momentSuggestion().items) if (!added(d)) { findOrCreate(d).updated = Date.now(); n++; } save(); toast(n ? `Added ${n} to My Zikr` : "All already in My Zikr", momentSuggestion().title); rerenderKeepScroll(); break; }
    case "period": ui.period = b.dataset.p; rerenderKeepScroll(); break;
    case "statopen": ui.statOpen = ui.statOpen === id ? null : id; rerenderKeepScroll(); break;
    case "reflect": openReflectionOverlay(+b.dataset.n, id, +b.dataset.tier); break;
    case "closeov": closeOverlay(b.closest(".overlay")); break;
    case "source": openSource(b.dataset.lib); break;
    case "closesrc": $layer.querySelectorAll(".sheet-src").forEach(x => x.remove()); $layer.querySelectorAll('.scrim[data-act="closesrc"]').forEach(x => x.remove()); break;
    case "add": openAdd(); break;
    case "closeadd": closeAdd(); break;
    case "kind": form.kind = b.dataset.kind; if (!form.filled) form.target = form.kind === "dua" ? 1 : 33; drawAdd(); break;
    case "pick": fill(BY_ID[id]); break;
    case "preset": form.target = +b.dataset.n; drawAdd(); break;
    case "save": saveAdd(); break;
    case "close": closeCounter(); break;
    case "sound": S.sound = !S.sound; save(); if (S.sound) tick(false); drawCounter(); break;
    case "menu": menuOpen = !menuOpen; drawCounter(); break;
    case "mode": S.mode = b.dataset.mode; save(); drawCounter(); break;
    case "openrefl": menuOpen = false; closeCounter(); ui.tab = "reflections"; render(true); break;
    case "undo": menuOpen = false; undo(current()); drawCounter(); break;
    case "resetround": menuOpen = false; current().count = 0; save(); drawCounter(); break;
    case "target": {
      menuOpen = false; const it = current(), opts = [1, 3, 7, 33, 99, 100, 1000], i = opts.indexOf(it.target);
      it.target = opts[(i + 1) % opts.length]; if (it.count >= it.target) it.count = 0; save(); drawCounter(); toast(`${it.target} per round`, it.title, hueOf(it.total).h, 1400); break;
    }
    case "delete": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to remove"; return; }
      menuOpen = false; const it = current(), its = counterItems(), idx = curIndex(); S.items = S.items.filter(x => x.id !== it.id); save();
      if (its.length > 1) { ui.counterId = its[(idx + 1) % its.length].id; drawCounter(); } else closeCounter();
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const o = [...document.querySelectorAll(".overlay")].pop(); if (o) return closeOverlay(o); if ($counter) closeCounter(); return; }
  if (!$counter || document.querySelector(".overlay") || e.target.closest("input, textarea")) return;
  if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); if (animating) return; if (ui.pending) collectPending(); else commitUp($counter.querySelector("#deck").clientHeight, 240); }
});
document.addEventListener("visibilitychange", () => { if ($counter && document.visibilityState === "visible") keepAwake(true); });
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { if (!S.theme) { applyTheme(); render(); } });
document.fonts?.ready?.then(() => $counter?.querySelectorAll(".card:not(.rcard-deck)").forEach(fitCard));
applyTheme(); render(true);
</script>

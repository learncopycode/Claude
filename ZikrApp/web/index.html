}

function achievementsHTML(it) {
  if (!it) { ui.achFor = null; return homeHTML(); }
  const unlocked = Math.floor(it.total / PER_COLOR), toNext = PER_COLOR - it.total % PER_COLOR, shown = Math.max(12, unlocked + 3), c = colorOf(it.total);
  let wins = "";
  for (let t = 1; t <= shown; t++) {
    const st = stopFor(t), r = reflectionFor(t), on = t <= unlocked, sc = stopColor(st);
    wins += on
      ? `<button class="win" data-act="reflect" data-id="${it.id}" data-tier="${t}" style="--c:${sc}">${artSVG(r.key, st)}<span class="wt"><b>${esc(r.title)}</b><small><i></i>${esc(st.name)} · ${fmt(t * PER_COLOR)}</small></span></button>`
      : `<div class="win locked" style="--c:${sc}"><span class="lockart">${ICONS.lock}</span><span class="wt"><b>${esc(r.title)}</b><small><i></i>${esc(st.name)} · at ${fmt(t * PER_COLOR)}</small></span></div>`;
  }
  return `<div class="wrap" style="--c:${c}">
    <div class="head"><button class="round-btn" data-act="closeach" aria-label="Back">${ICONS.back}</button><button class="round-btn" data-act="open" data-id="${it.id}" aria-label="Open counter">${ICONS.beads}</button></div>
    <div class="ach-head"><span class="eyebrow">${esc(it.title)}</span><span class="orb">${fmt(it.total)}</span>
      <b>${toNext} more to reach ${esc(stopFor(unlocked + 1).name)} · ${esc(reflectionFor(unlocked + 1).title)}</b>
      <span class="progress"><i style="width:${PER_COLOR - toNext}%"></i></span></div>
    <h2 class="sec-title">Reflections <small>${unlocked} unlocked</small></h2>
    <div class="windows">${wins}</div>
    <h2 class="sec-title">Totals</h2>${panelHTML(itemDays(it), it.total, it.title)}
  </div>`;
}

/* ================= Bead ring ================= */
function ringSVG(count, target, color, size, beadMax = 6) {
  const N = target > 0 && target <= 100 ? Math.max(1, target) : 33, per = target > 0 ? target / N : 1;
  const lit = target > 0 ? Math.floor(count / per) : count % N, R = size / 2 - beadMax - 2;
  const br = Math.max(1.6, Math.min(beadMax, (Math.PI * 2 * R / N) * 0.36));
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i + 0.5) * (Math.PI * 2 / N), x = size / 2 + R * Math.cos(a), y = size / 2 + R * Math.sin(a), on = i < lit;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${br.toFixed(1)}" fill="${on ? color : "rgba(243,236,221,0.13)"}"${on ? ` style="filter:drop-shadow(0 0 ${br}px ${color})"` : ""}/>`;
  }
  s += `<circle cx="${size / 2}" cy="${(size / 2 - R - br * 0.2).toFixed(1)}" r="${(br * 1.25).toFixed(1)}" fill="var(--gold)"/></svg>`;
  return s;
}

/* ================= Counter (swipe deck) ================= */
let $counter = null, animating = false, menuOpen = false;
const counterItems = () => sortedItems();
const curIndex = () => Math.max(0, counterItems().findIndex(i => i.id === ui.counterId));
const current = () => counterItems()[curIndex()];
const nextItem = () => { const its = counterItems(); return S.mode === "single" ? current() : its[(curIndex() + 1) % its.length]; };

function openCounter(id) {
  ui.counterId = id;
  if (!$counter) { $counter = document.createElement("section"); $counter.className = "counter"; $counter.setAttribute("aria-label", "Counter"); $layer.appendChild($counter); }
  drawCounter(); keepAwake(true);
}
function closeCounter() { $counter?.remove(); $counter = null; menuOpen = false; keepAwake(false); render(); }

function cardHTML(it, role, preview = 0) {
  const total = it.total + preview, raw = it.count + preview, count = it.target > 0 && raw >= it.target ? 0 : raw, c = colorOf(total);
  const len = it.arabic.length, focus = S.mode === "single";
  const arSize = len > 700 ? 16 : len > 400 ? 19 : len > 200 ? 23 : len > 90 ? 28 : len > 40 ? 34 : 44;
  const ring = focus ? 190 : 150;
  return `<div class="card ${role} ${focus ? "focus" : ""}" style="--c:${c}">
    <div class="arch"><span class="lbl">${esc(it.title)}</span>
      ${it.arabic ? `<div class="arb ar" style="font-size:${arSize}px">${esc(it.arabic)}</div>` : `<div class="arb display" style="font-size:34px">${esc(it.title)}</div>`}
    </div>
    <div class="words">
      ${it.translit && len < 420 ? `<div class="tl" style="font-size:${len > 160 ? 13 : 15.5}px">${esc(it.translit)}</div>` : ""}
      ${it.translation && !(focus && len > 120) ? `<div class="en" style="font-size:${len > 160 ? 13 : 14.5}px">${esc(it.translation)}</div>` : ""}
      <span class="src">${it.source ? "✓ " + esc(it.source) : ""}${len > 200 ? ` <button class="full" data-act="fulltext">Read in full</button>` : ""}</span>
    </div>
    <div class="beads"><span data-f="ring">${ringSVG(count, it.target, c, ring)}</span>
      <span class="center"><span class="cnt" data-f="cnt">${count}</span><span class="of" data-f="of">${it.target ? `of ${it.target}` : "no target"}${it.rounds ? ` · ${it.rounds} round${it.rounds === 1 ? "" : "s"}` : ""}</span></span></div>
  </div>`;
}

function drawCounter() {
  if (!$counter) return;
  const its = counterItems(), it = current(); if (!it) return closeCounter();
  const c = colorOf(it.total); $counter.style.setProperty("--c", c);
  $counter.innerHTML = `
    <div class="chead">
      <button class="round-btn" data-act="close" aria-label="Close">${ICONS.back}</button>
      <div class="grow"><button class="left-pill" data-act="target" aria-label="Change target"><i></i><span data-f="left">${it.target ? `${it.target - it.count} left` : `${fmt(it.total)} total`}</span></button></div>
      <button class="round-btn" data-act="ach" data-id="${it.id}" aria-label="Reflections and achievements">${ICONS.trophy}</button>
      <button class="round-btn" data-act="sound" aria-label="${S.sound ? "Sound on" : "Sound off"}">${S.sound ? ICONS.soundOn : ICONS.soundOff}</button>
      <button class="round-btn" data-act="menu" aria-label="More">${ICONS.more}</button>
      ${menuOpen ? `<div class="menu"><button data-act="undo">Undo last count</button><button data-act="target">Change target</button><button data-act="resetround">Reset current round</button><button data-act="delete" style="color:#f0a49a">Remove this counter</button></div>` : ""}
    </div>
    <div class="modes" role="group" aria-label="Swipe mode"><span class="thumb"></span>
      <button data-act="mode" data-mode="feed" aria-pressed="${S.mode === "feed"}">Zikr feed</button>
      <button data-act="mode" data-mode="single" aria-pressed="${S.mode === "single"}">Single zikr</button></div>
    <div class="deck" id="deck">${cardHTML(nextItem(), "back", S.mode === "single" ? 1 : 0)}${cardHTML(it, "top")}
      ${S.mode === "feed" && its.length > 1 ? `<div class="dots">${its.map((x, i) => `<i class="${i === curIndex() ? "on" : ""}"></i>`).join("")}</div>` : ""}</div>
    <div class="hint">${S.mode === "feed" ? "Read, then swipe up. Each swipe counts and brings your next zikr." : "Swipe up or tap to count."}</div>`;
  const m = $counter.querySelector(".modes"), on = m.querySelector('[aria-pressed="true"]'), th = m.querySelector(".thumb");
  th.style.left = on.offsetLeft + "px"; th.style.width = on.offsetWidth + "px";
  setBack(0); bindDeck();
}
function setBack(progress, ms) {
  const back = $counter?.querySelector(".card.back"); if (!back) return;
  back.style.transition = ms ? `transform ${ms}ms ease-out, opacity ${ms}ms ease-out` : "none";
  back.style.transform = `translateY(${28 * (1 - progress)}px) scale(${0.92 + 0.08 * progress})`;
  back.style.opacity = 0.4 + 0.6 * progress;
}
function updateTop() {
  const it = current(), top = $counter.querySelector(".card.top"), c = colorOf(it.total);
  $counter.style.setProperty("--c", c); top.style.setProperty("--c", c);
  const cnt = top.querySelector('[data-f="cnt"]'); cnt.textContent = it.count; cnt.classList.remove("bump"); void cnt.offsetWidth; cnt.classList.add("bump");
  top.querySelector('[data-f="of"]').textContent = (it.target ? `of ${it.target}` : "no target") + (it.rounds ? ` · ${it.rounds} round${it.rounds === 1 ? "" : "s"}` : "");
  top.querySelector('[data-f="ring"]').innerHTML = ringSVG(it.count, it.target, c, S.mode === "single" ? 190 : 150);
  $counter.querySelector('[data-f="left"]').textContent = it.target ? `${it.target - it.count} left` : `${fmt(it.total)} total`;
}
function countCurrent() {
  const it = current(), res = increment(it);
  tick(res.unlocked || res.round || it.total % 33 === 0);
  if (res.unlocked) setTimeout(() => openReflection(it.id, res.unlocked, true), 450);
  else if (res.round) toast(`Round complete`, `${it.title} · ${it.rounds} round${it.rounds === 1 ? "" : "s"} done`, colorOf(it.total));
}
function plusOne() { const d = $counter?.querySelector("#deck"); if (!d) return; const el = document.createElement("span"); el.className = "plus1"; el.textContent = "+1"; d.appendChild(el); setTimeout(() => el.remove(), 950); }
function glowAt(e) {
  const top = $counter.querySelector(".card.top"), r = top.getBoundingClientRect(), el = document.createElement("span");
  el.className = "glow"; el.style.left = (e.clientX - r.left) + "px"; el.style.top = (e.clientY - r.top) + "px"; top.appendChild(el); setTimeout(() => el.remove(), 750);
}
function bindDeck() {
  const deck = $counter.querySelector("#deck"); let drag = null;
  deck.onpointerdown = e => {
    if (animating || e.target.closest("[data-act]")) return;
    drag = { y: e.clientY, dy: 0, moved: false, armed: false, samples: [[e.clientY, performance.now()]] };
    deck.setPointerCapture(e.pointerId); deck.querySelector(".card.top").style.transition = "none";
  };
  deck.onpointermove = e => {
    if (!drag || animating) return;
    const dy = e.clientY - drag.y; drag.dy = dy; if (Math.abs(dy) > 8) drag.moved = true;
    drag.samples.push([e.clientY, performance.now()]); if (drag.samples.length > 5) drag.samples.shift();
    if (!drag.moved) return;
    const h = deck.clientHeight, canBack = S.mode === "feed" && counterItems().length > 1;
    const off = dy > 0 ? dy * (canBack ? 0.6 : 0.15) : dy, prog = Math.min(1, Math.max(0, -off / h));
    deck.querySelector(".card.top").style.transform = `translateY(${off}px) rotateX(${(off / h) * 16}deg) scale(${1 - 0.04 * prog})`;
    setBack(prog);
    const armed = dy < -90; if (armed !== drag.armed) { drag.armed = armed; if (armed && navigator.vibrate) try { navigator.vibrate(4); } catch (e2) {} }
  };
  deck.onpointerup = deck.onpointercancel = e => {
    if (!drag || animating) return; const d = drag; drag = null;
    if (!d.moved) { countCurrent(); glowAt(e); plusOne(); updateTop(); return; }
    const s0 = d.samples[0], s1 = d.samples[d.samples.length - 1], v = (s1[0] - s0[0]) / Math.max(1, s1[1] - s0[1]);
    const h = deck.clientHeight, canBack = S.mode === "feed" && counterItems().length > 1;
    if (d.dy < -90 || v < -0.7) commitUp(h, Math.max(150, 280 - Math.abs(v) * 60));
    else if (canBack && (d.dy > 110 || v > 0.9)) commitDown(h);
    else { const top = deck.querySelector(".card.top"); top.style.transition = "transform 0.5s cubic-bezier(.2,1.4,.4,1)"; top.style.transform = "none"; setBack(0, 450); }
  };
}
function commitUp(h, dur) {
  animating = true;
  const top = $counter.querySelector(".card.top");
  top.style.transition = `transform ${dur}ms cubic-bezier(.35,0,.75,.4), opacity ${dur}ms`;
  top.style.transform = `translateY(${-h * 1.15}px) rotateX(-14deg) scale(.94)`; top.style.opacity = "0.6";
  setBack(1, dur);
  setTimeout(() => {
    countCurrent();
    if (S.mode === "feed") { const its = counterItems(); ui.counterId = its[(curIndex() + 1) % its.length].id; }
    animating = false; drawCounter(); plusOne();
  }, dur);
}
function commitDown(h) {
  animating = true; const its = counterItems(); ui.counterId = its[(curIndex() - 1 + its.length) % its.length].id; drawCounter();
  const top = $counter.querySelector(".card.top"); top.style.transition = "none"; top.style.transform = `translateY(${-h}px)`; void top.offsetWidth;
  top.style.transition = "transform 0.55s cubic-bezier(.2,1,.3,1)"; top.style.transform = "none"; setTimeout(() => { animating = false; }, 550);
}

/* ================= Reflection overlay ================= */
function openReflection(itemId, tier, celebrate) {
  const it = itemById(itemId), r = reflectionFor(tier), st = stopFor(tier), c = stopColor(st);
  document.querySelectorAll(".reflect").forEach(e => e.remove());
  const el = document.createElement("section"); el.className = "reflect"; el.style.setProperty("--c", c);
  el.setAttribute("role", "dialog"); el.setAttribute("aria-label", r.title);
  el.innerHTML = `<button class="round-btn close" data-act="closereflect" aria-label="Close">${ICONS.close}</button>
    <div class="artbox">${artSVG(r.key, st)}</div>
    <div class="body">
      <span class="milestone"><i></i>${fmt(tier * PER_COLOR)} × ${esc(it ? it.title : "")} · ${esc(st.name)}</span>
      ${celebrate ? `<span class="eyebrow">A new blessing to reflect on</span>` : `<span class="eyebrow">Reflection ${((tier - 1) % REFLECTIONS.length) + 1} of ${REFLECTIONS.length}</span>`}
      <h1>${esc(r.title)}</h1>
      <div class="verse"><div class="ar">${esc(r.ar)}</div><div class="tl">${esc(r.tl)}</div><div class="en">${esc(r.en)}</div><div class="ref">${esc(r.ref)}</div></div>
      <p class="para">${esc(r.reflect)}</p>
      <div class="wonder"><span class="eyebrow">A wonder</span>${esc(r.wonder)}</div>
      <div class="btn-row"><button class="btn" data-act="closereflect">Alhamdulillah</button>${it ? `<button class="btn ghost" data-act="ach" data-id="${it.id}">All reflections</button>` : ""}</div>
    </div>`;
  document.body.appendChild(el);
  if (celebrate) burst(c);
}
function burst(c) {
  const cx = innerWidth / 2, cy = Math.min(innerHeight * 0.3, 220);
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160, size = 4 + Math.random() * 7;
    s.className = "spark"; Object.assign(s.style, { left: cx + "px", top: cy + "px", width: size + "px", height: size + "px", background: i % 3 ? c : "#f3ecdd", animationDelay: (Math.random() * 0.15) + "s" });
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}
function toast(title, text, c, ms = 2000) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.style.setProperty("--c", c);
  t.innerHTML = `<span class="sw"></span><span><b>${esc(title)}</b><span>${esc(text)}</span></span>`;
  document.body.appendChild(t); setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 360); }, ms);
}
function openFullText() {
  const it = current();
  const el = document.createElement("section"); el.className = "reflect"; el.style.setProperty("--c", colorOf(it.total));
  el.innerHTML = `<button class="round-btn close" data-act="closereflect" aria-label="Close">${ICONS.close}</button>
    <div class="body" style="margin-top:calc(70px + env(safe-area-inset-top, 0px))"><span class="eyebrow">${esc(it.title)}</span>
    <div class="verse"><div class="ar">${esc(it.arabic)}</div><div class="tl">${esc(it.translit)}</div><div class="en">${esc(it.translation)}</div><div class="ref">${esc(it.source)}</div></div>
    <div class="btn-row"><button class="btn" data-act="closereflect">Back to counting</button></div></div>`;
  document.body.appendChild(el);
}

/* ================= Add sheet ================= */
const form = { kind: "zikr", title: "", arabic: "", translit: "", translation: "", target: 33, filled: null };
function openAdd() {
  Object.assign(form, { kind: "zikr", title: "", arabic: "", translit: "", translation: "", target: 33, filled: null });
  $layer.insertAdjacentHTML("beforeend", `<div class="scrim" data-act="closeadd"></div><div class="sheet" role="dialog" aria-label="Add a zikr"><div class="in" id="addin"></div></div>`);
  drawAdd(); setTimeout(() => document.getElementById("f-title")?.focus(), 380);
}
function closeAdd() { $layer.querySelectorAll(".scrim, .sheet").forEach(e => e.remove()); }
const unchanged = () => form.filled && form.filled.arabic === form.arabic && form.filled.title === form.title;
function drawAdd() {
  const el = document.getElementById("addin"); if (!el) return;
  el.innerHTML = `
    <div class="top"><button class="textbtn" data-act="closeadd" style="color:var(--muted);font-weight:600">Cancel</button><b>Add a zikr</b><button class="textbtn" data-act="save" ${form.title.trim() ? "" : "disabled"}>Add</button></div>
    <div class="seg" role="group" aria-label="Type">${["zikr", "dua"].map(k => `<button data-act="kind" data-kind="${k}" aria-pressed="${form.kind === k}">${k === "zikr" ? "Zikr" : "Dua"}</button>`).join("")}</div>
    <label class="field">${ICONS.search}<input id="f-title" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type in English, e.g. “hasbunallah”" value="${esc(form.title)}"></label>
    <div id="results"></div>
    <label class="field"><textarea id="f-arabic" class="ar" rows="2" dir="rtl" placeholder="النَّصُّ الْعَرَبِيُّ">${esc(form.arabic)}</textarea></label>
    <label class="field"><textarea id="f-translit" rows="2" placeholder="Transliteration">${esc(form.translit)}</textarea></label>
    <label class="field"><textarea id="f-translation" rows="2" placeholder="Meaning in English">${esc(form.translation)}</textarea></label>
    ${form.filled ? `<div class="verified">${unchanged() ? "✓ " + esc(form.filled.source) : "Edited by you · originally " + esc(form.filled.source)}</div>` : ""}
    <div class="eyebrow" style="margin-top:18px">Count per round</div>
    <div class="presets">${[1, 3, 7, 33, 99, 100, 1000].map(n => `<button data-act="preset" data-n="${n}" aria-pressed="${form.target === n}">${n}</button>`).join("")}</div>`;
  const t = document.getElementById("f-title");
  t.oninput = () => { form.title = t.value; drawResults(); el.querySelector('[data-act="save"]').disabled = !form.title.trim(); };
  t.onkeydown = e => { if (e.key === "Enter") { const r = search(form.title)[0]; if (r) fill(r); } };
  for (const [id, key] of [["f-arabic", "arabic"], ["f-translit", "translit"], ["f-translation", "translation"]]) { const f = document.getElementById(id); f.oninput = () => { form[key] = f.value; }; }
  drawResults();
}
function drawResults() {
  const box = document.getElementById("results"); if (!box) return;
  const show = form.title.trim().length >= 2 && (!form.filled || form.filled.title !== form.title), res = show ? search(form.title) : [];
  box.innerHTML = show ? `<div class="results">${res.length ? res.map(d => `<button class="res" data-act="pick" data-id="${d.id}"><span class="rb"><b>${esc(d.title)}</b><span class="ar">${esc(d.arabic)}</span><small>${esc(d.source)}</small></span></button>`).join("") : `<div class="res muted">No verified match yet. Keep typing, or fill in the fields yourself.</div>`}</div>` : "";
}
function fill(d) { Object.assign(form, { title: d.title, arabic: d.arabic, translit: d.translit, translation: d.meaning, target: d.count, filled: d }); drawAdd(); }
function saveAdd() {
  if (!form.title.trim()) return;
  let it;
  if (unchanged()) { it = findOrCreate(form.filled); it.target = form.target; }
  else { it = { id: uid(), title: form.title.trim(), arabic: form.arabic.trim(), translit: form.translit.trim(), translation: form.translation.trim(), source: "", target: form.target, count: 0, rounds: 0, total: 0, libraryID: null, createdAt: Date.now() }; S.items.push(it); }
  it.updated = Date.now(); save(); closeAdd(); ui.tab = "home"; ui.sub = null; render(); openCounter(it.id);
}

/* ================= Events ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case "tab": ui.tab = b.dataset.tab; ui.sub = null; ui.achFor = null; render(); $screen.scrollTop = 0; break;
    case "home": ui.sub = null; render(); $screen.scrollTop = 0; break;
    case "sub": ui.sub = b.dataset.sub; render(); $screen.scrollTop = 0; break;
    case "open": document.querySelectorAll(".reflect").forEach(x => x.remove()); ui.achFor = null; render(); openCounter(id); break;
    case "lib": openCounter(findOrCreate(BY_ID[id]).id); break;
    case "period": ui.period = b.dataset.p; render(); break;
    case "ach": document.querySelectorAll(".reflect").forEach(x => x.remove()); if ($counter) closeCounter(); ui.achFor = id; render(); $screen.scrollTop = 0; break;
    case "closeach": ui.achFor = null; render(); break;
    case "reflect": openReflection(id, +b.dataset.tier, false); break;
    case "closereflect": b.closest(".reflect")?.remove(); break;
    case "fulltext": openFullText(); break;
    case "add": openAdd(); break;
    case "closeadd": closeAdd(); break;
    case "kind": form.kind = b.dataset.kind; if (!form.filled) form.target = form.kind === "dua" ? 1 : 33; drawAdd(); break;
    case "pick": fill(BY_ID[id]); break;
    case "preset": form.target = +b.dataset.n; drawAdd(); break;
    case "save": saveAdd(); break;
    case "close": closeCounter(); break;
    case "sound": S.sound = !S.sound; save(); if (S.sound) tick(false); drawCounter(); break;
    case "menu": menuOpen = !menuOpen; drawCounter(); break;
    case "mode": S.mode = b.dataset.mode; save(); drawCounter(); break;
    case "undo": menuOpen = false; undo(current()); drawCounter(); break;
    case "resetround": menuOpen = false; current().count = 0; save(); drawCounter(); break;
    case "target": {
      menuOpen = false; const it = current(), opts = [1, 3, 7, 33, 99, 100, 1000], i = opts.indexOf(it.target);
      it.target = opts[(i + 1) % opts.length]; if (it.count >= it.target) it.count = 0; save(); drawCounter();
      toast(`${it.target} per round`, "Tap the pill again to change it.", colorOf(it.total), 1500); break;
    }
    case "delete": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to remove"; return; }
      menuOpen = false; const it = current(), its = counterItems(); S.items = S.items.filter(x => x.id !== it.id); save();
      if (its.length > 1) { ui.counterId = its[(curIndex() + 1) % its.length]?.id || S.items[0].id; drawCounter(); } else closeCounter();
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const r = document.querySelector(".reflect"); if (r) { r.remove(); return; } if ($counter) closeCounter(); return; }
  if (!$counter || document.querySelector(".reflect") || e.target.closest("input, textarea")) return;
  if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); if (!animating) commitUp($counter.querySelector("#deck").clientHeight, 240); }
});
document.addEventListener("visibilitychange", () => { if ($counter && document.visibilityState === "visible") keepAwake(true); });
render();
</script>

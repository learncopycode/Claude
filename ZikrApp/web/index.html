ِبَادَتِكَ ‏\"‏ ‏.‏ وَأَوْصَى بِذَلِكَ مُعَاذٌ الصُّنَابِحِيَّ وَأَوْصَى بِهِ الصُّنَابِحِيُّ أَبَا عَبْدِ الرَّحْمَنِ ‏.‏", "narrator": "Mu'adh b. Jabal reported that the Messenger of Allah (ﷺ) caught his hand and said:", "en": "By Allah, I love you, Mu'adh. I give some instruction to you. Never leave to recite this supplication after every (prescribed) prayer: \"O Allah, help me in remembering You, in giving You thanks, and worshipping You well.\" Mu'adh willed this supplication to the narrator al-Sunabihi and al-Sunabihi to 'Abu Abd al-Rahman.", "grade": "Sahih (Al-Albani) ", "match": 0.44}, "Sahih al-Bukhari 6369": {"ref": "Sahih al-Bukhari 6369", "url": "https://sunnah.com/bukhari:6369", "ar": "‏ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ ‏", "narrator": "Narrated Anas bin Malik:", "en": "The Prophet (ﷺ) used to say, \"O Allah! I seek refuge with You from worry and grief, from incapacity and laziness, from cowardice and miserliness, from being heavily in debt and from being overpowered by (other) men.\" (See Hadith No. 374)", "grade": "Sahih", "match": 0.12}, "Sahih al-Bukhari 6346": {"ref": "Sahih al-Bukhari 6346", "url": "https://sunnah.com/bukhari:6346", "ar": "‏ لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَوَاتِ، وَرَبُّ الأَرْضِ، وَرَبُّ الْعَرْشِ الْكَرِيمِ ‏", "narrator": "Narrated Ibn `Abbas:", "en": "Allah's Messenger (ﷺ) used to say at a time of distress, \"La ilaha illal-lahu Rabbul-l-'arsh il-'azim, La ilaha illallahu Rabbu-s-samawati wa Rabbu-l-ard, Rabbu-l-'arsh-il-Karim.\"", "grade": "Sahih", "match": 0.56}, "Sahih al-Bukhari 6389": {"ref": "Sahih al-Bukhari 6389", "url": "https://sunnah.com/bukhari:6389", "ar": "‏ اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ ‏", "narrator": "Narrated Anas:", "en": "The most frequent invocation of The Prophet (ﷺ) was: \"O Allah! Give to us in the world that which is good and in the Hereafter that which is good, and save us from the torment of the Fire.\" (2:201)", "grade": "Sahih", "match": 0.15}, "Sahih al-Bukhari 6324": {"ref": "Sahih al-Bukhari 6324", "url": "https://sunnah.com/bukhari:6324", "ar": "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ حُذَيْفَةَ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا أَرَادَ أَنْ يَنَامَ قَالَ ‏\"‏ بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا ‏\"‏‏.‏ وَإِذَا اسْتَيْقَظَ مِنْ مَنَامِهِ قَالَ ‏\"‏ الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ ‏\"‏‏.‏", "narrator": "Narrated Hudhaifa:", "en": "Whenever the Prophet (ﷺ) intended to go to bed, he would recite: \"Bismika Allahumma amutu wa ahya (With Your name, O Allah, I die and I live).\" And when he woke up from his sleep, he would say: \"Al-hamdu lil-lahil-ladhi ahyana ba'da ma amatana; wa ilaihi an-nushur (All the Praises are for Allah Who has made us alive after He made us die (sleep) and unto Him is the Resurrection). \"", "grade": "Sahih", "match": 0.69}, "Sunan Abi Dawud 5095": {"ref": "Sunan Abi Dawud 5095", "url": "https://sunnah.com/abudawud:5095", "ar": "حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْحَسَنِ الْخَثْعَمِيُّ، حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏\"‏ إِذَا خَرَجَ الرَّجُلُ مِنْ بَيْتِهِ فَقَالَ بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ ‏\"‏ ‏.‏ قَالَ ‏\"‏ يُقَالُ حِينَئِذٍ هُدِيتَ وَكُفِيتَ وَوُقِيتَ فَتَتَنَحَّى لَهُ الشَّيَاطِينُ فَيَقُولُ لَهُ شَيْطَانٌ آخَرُ كَيْفَ لَكَ بِرَجُلٍ قَدْ هُدِيَ وَكُفِيَ وَوُقِيَ ‏\"‏ ‏.‏", "narrator": "Narrated Anas ibn Malik:", "en": "The Prophet (ﷺ) said: When a man goes out of his house and says: \"In the name of Allah, I trust in Allah; there is no might and no power but in Allah,\" the following will be said to him at that time: \"You are guided, defended and protected.\" The devils will go far from him and another devil will say: How can you deal with a man who has been guided, defended and protected?", "grade": "Sahih (Al-Albani) ", "match": 0.25}, "Sahih Muslim 1342": {"ref": "Sahih Muslim 1342", "url": "https://sunnah.com/muslim:1342", "ar": "حَدَّثَنِي هَارُونُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، قَالَ قَالَ ابْنُ جُرَيْجٍ أَخْبَرَنِي أَبُو الزُّبَيْرِ، أَنَّ عَلِيًّا الأَزْدِيَّ، أَخْبَرَهُ أَنَّ ابْنَ عُمَرَ عَلَّمَهُمْ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ إِذَا اسْتَوَى عَلَى بَعِيرِهِ خَارِجًا إِلَى سَفَرٍ كَبَّرَ ثَلاَثًا ثُمَّ قَالَ ‏\"‏ سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى وَمِنَ الْعَمَلِ مَا تَرْضَى اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ وَالْخَلِيفَةُ فِي الأَهْلِ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ وَكَآبَةِ الْمَنْظَرِ وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالأَهْلِ ‏\"‏ ‏.‏ وَإِذَا رَجَعَ قَالَهُنَّ ‏.‏ وَزَادَ فِيهِنَّ ‏\"‏ آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ ‏\"‏ ‏.‏", "narrator": "Ibn Umar (Allah be pleased with them) reported that whenever Allah's Messenger (ﷺ) mounted his camel while setting out on a journey, he glorified Allah (uttered Allah-o-Akbar) thrice, and then said:", "en": "Hallowed is He Who subdued for us this (ride) and we were not ourselves powerful enough to use It as a ride, and we are going to return to our Lord. O Allah, we seek virtue and piety from You in this journey of ours and the act which pleaseth You. O Allah, lighten this journey of ours, and make its distance easy for us. O Allah, You are (our) companion during the journey, and guardian of (our) family. O Allah, I seek refuge with You from hardships of the journey, gloominess of the sights, and finding of evil changes in property and family on return. And he (the Prophet) uttered (these words), and made this addition to them: We are returning, repentant, worshipping our Lord. and praising Him.", "grade": "Sahih", "match": 0.26}, "Sahih Muslim 713": {"ref": "Sahih Muslim 713 a", "url": "https://sunnah.com/muslim:713a", "ar": "‏ إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَقُلِ اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ ‏.‏ وَإِذَا خَرَجَ فَلْيَقُلِ اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ ‏", "narrator": "Abu Usaid reported that the Messenger of Allah (ﷺ) said:", "en": "When any one of you enters the mosque, he should say:\" O Allah! open for me the doors of Your mercy\" ; and when he steps out he should say: 'O Allah! I beg of You Your Grace.\" (Imam Muslim said: I heard Yahya saying: I transcribed this hadith from the compilation of Sulaiman b. Bilal.)", "grade": "Sahih", "match": 0.1}, "Sahih al-Bukhari 3616": {"ref": "Sahih al-Bukhari 3616", "url": "https://sunnah.com/bukhari:3616", "ar": "حَدَّثَنَا مُعَلَّى بْنُ أَسَدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُخْتَارٍ، حَدَّثَنَا خَالِدٌ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ أَنَّ النَّبِيَّ صلى الله عليه وسلم دَخَلَ عَلَى أَعْرَابِيٍّ ـ يَعُودُهُ ـ قَالَ وَكَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا دَخَلَ عَلَى مَرِيضٍ يَعُودُهُ قَالَ لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ‏.‏ فَقَالَ لَهُ ‏\"‏ لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ ‏\"‏‏.‏ قَالَ قُلْتَ طَهُورٌ كَلاَّ بَلْ هِيَ حُمَّى تَفُورُ ـ أَوْ تَثُورُ ـ عَلَى شَيْخٍ كَبِيرٍ، تُزِيرُهُ الْقُبُورَ‏.‏ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ فَنَعَمْ إِذًا ‏\"‏‏.‏", "narrator": "Narrated Ibn `Abbas:", "en": "The Prophet (ﷺ) paid a visit to a sick bedouin. The Prophet (ﷺ) when visiting a patient used to say, \"No harm will befall you! May Allah cure you! May Allah cure you!\" So the Prophet (ﷺ) said to the bedouin. \"No harm will befall you. May Allah cure you!\" The bedouin said, \"You say, may Allah cure me? No, for it is a fever which boils in (the body of) an old man, and will lead him to the grave.\" The Prophet (ﷺ) said, \"Yes, then may it be as you say.\"", "grade": "Sahih", "match": 0.29}, "Sahih al-Bukhari 2311": {"ref": "Sahih al-Bukhari 2311", "url": "https://sunnah.com/bukhari:2311", "ar": "وَقَالَ عُثْمَانُ بْنُ الْهَيْثَمِ أَبُو عَمْرٍو حَدَّثَنَا عَوْفٌ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ وَكَّلَنِي رَسُولُ اللَّهِ صلى الله عليه وسلم بِحِفْظِ زَكَاةِ رَمَضَانَ، فَأَتَانِي آتٍ فَجَعَلَ يَحْثُو مِنَ الطَّعَامِ، فَأَخَذْتُهُ، وَقُلْتُ وَاللَّهِ لأَرْفَعَنَّكَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم‏.‏ قَالَ إِنِّي مُحْتَاجٌ، وَعَلَىَّ عِيَالٌ، وَلِي حَاجَةٌ شَدِيدَةٌ‏.‏ قَالَ فَخَلَّيْتُ عَنْهُ فَأَصْبَحْتُ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ يَا أَبَا هُرَيْرَةَ مَا فَعَلَ أَسِيرُكَ الْبَارِحَةَ ‏\"‏‏.‏ قَالَ قُلْتُ يَا رَسُولَ اللَّهِ شَكَا حَاجَةً شَدِيدَةً وَعِيَالاً فَرَحِمْتُهُ، فَخَلَّيْتُ سَبِيلَهُ‏.‏ قَالَ ‏\"‏ أَمَا إِنَّهُ قَدْ كَذَبَكَ وَسَيَعُودُ ‏\"‏‏.‏ فَعَرَفْتُ أَنَّهُ سَيَعُودُ لِقَوْلِ رَسُولِ اللَّهِ صلى الله عليه وسلم إِنَّهُ سَيَعُودُ‏.‏ فَرَصَدْتُهُ فَجَاءَ يَحْثُو مِنَ الطَّعَامِ فَأَخَذْتُهُ فَقُلْتُ لأَرْفَعَنَّكَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم‏.‏ قَالَ دَعْنِي فَإِنِّي مُحْتَاجٌ، وَعَلَىَّ عِيَالٌ لاَ أَعُودُ، فَرَحِمْتُهُ، فَخَلَّيْتُ سَبِيلَهُ فَأَصْبَحْتُ، فَقَالَ لِي رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ يَا أَبَا هُرَيْرَةَ، مَا فَعَلَ أَسِيرُكَ ‏\"‏‏.‏ قُلْتُ يَا رَسُولَ اللَّهِ شَكَا حَاجَةً شَدِيدَةً وَعِيَالاً، فَرَحِمْتُهُ فَخَلَّيْتُ سَبِيلَهُ‏.‏ قَالَ ‏\"‏ أَمَا إِنَّهُ قَدْ كَذَبَكَ وَسَيَعُودُ ‏\"‏‏.‏ فَرَصَدْتُهُ الثَّالِثَةَ فَجَاءَ يَحْثُو مِنَ الطَّعَامِ، فَأَخَذْتُهُ فَقُلْتُ لأَرْفَعَنَّكَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم، وَهَذَا آخِرُ ثَلاَثِ مَرَّاتٍ أَنَّكَ تَزْعُمُ لاَ تَعُودُ ثُمَّ تَعُودُ‏.‏ قَالَ دَعْنِي أُعَلِّمْكَ كَلِمَاتٍ يَنْفَعُكَ اللَّهُ بِهَا‏.‏ قُلْتُ مَا هُوَ قَالَ إِذَا أَوَيْتَ إِلَى فِرَاشِكَ فَاقْرَأْ آيَةَ الْكُرْسِيِّ ‏{‏اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَىُّ الْقَيُّومُ‏}‏ حَتَّى تَخْتِمَ الآيَةَ، فَإِنَّكَ لَنْ يَزَالَ عَلَيْكَ مِنَ اللَّهِ حَافِظٌ وَلاَ يَقْرَبَنَّكَ شَيْطَانٌ حَتَّى تُصْبِحَ‏.‏ فَخَلَّيْتُ سَبِيلَهُ فَأَصْبَحْتُ، فَقَالَ لِي رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ مَا فَعَلَ أَسِيرُكَ الْبَارِحَةَ ‏\"‏‏.‏ قُلْتُ يَا رَسُولَ اللَّهِ زَعَمَ أَنَّهُ يُعَلِّمُنِي كَلِمَاتٍ، يَنْفَعُنِي اللَّهُ بِهَا، فَخَلَّيْتُ سَبِيلَهُ‏.‏ قَالَ ‏\"‏ مَا هِيَ ‏\"‏‏.‏ قُلْتُ قَالَ لِي إِذَا أَوَيْتَ إِلَى فِرَاشِكَ فَاقْرَأْ آيَةَ الْكُرْسِيِّ مِنْ أَوَّلِهَا حَتَّى تَخْتِمَ ‏{‏اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَىُّ الْقَيُّومُ‏}‏ وَقَالَ لِي لَنْ يَزَالَ عَلَيْكَ مِنَ اللَّهِ حَافِظٌ وَلاَ يَقْرَبَكَ شَيْطَانٌ حَتَّى تُصْبِحَ، وَكَانُوا أَحْرَصَ شَىْءٍ عَلَى الْخَيْرِ‏.‏ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ أَمَا إِنَّهُ قَدْ صَدَقَكَ وَهُوَ كَذُوبٌ، تَعْلَمُ مَنْ تُخَاطِبُ مُنْذُ ثَلاَثِ لَيَالٍ يَا أَبَا هُرَيْرَةَ ‏\"‏‏.‏ قَالَ لاَ‏.‏ قَالَ ‏\"‏ ذَاكَ شَيْطَانٌ ‏\"‏‏.‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) deputed me to keep Sadaqat (al-Fitr) of Ramadan. A comer came and started taking handfuls of the foodstuff (of the Sadaqa) (stealthily). I took hold of him and said, \"By Allah, I will take you to Allah's Messenger (ﷺ) .\" He said, \"I am needy and have many dependents, and I am in great need.\" I released him, and in the morning Allah's Messenger (ﷺ) asked me, \"What did your prisoner do yesterday?\" I said, \"O Allah's Messenger (ﷺ) ! The person complained of being needy and of having many dependents, so, I pitied him and let him go.\" Allah's Messenger (ﷺ) said, \"Indeed, he told you a lie and he will be coming again.\" I believed that he would show up again as Allah's Messenger (ﷺ) had told me that he would return. So, I waited for him watchfully. When he (showed up and) started stealing handfuls of foodstuff, I caught hold of him again and said, \"I will definitely take you to Allah's Messenger (ﷺ) . He said, \"Leave me, for I am very needy and have many dependents. I promise I will not come back again.\" I pitied him and let him go. In the morning Allah's Messenger (ﷺ) asked me, \"What did your prisoner do.\" I replied, \"O Allah's Messenger (ﷺ) ! He complained of his great need and of too many dependents, so I took pity on him and set him free.\" Allah's Messenger (ﷺ) said, \"Verily, he told you a lie and he will return.\" I waited for him attentively for the third time, and when he (came and) started stealing handfuls of the foodstuff, I caught hold of him and said, \"I will surely take you to Allah's Messenger (ﷺ) as it is the third time you promise not to return, yet you break your promise and come.\" He said, \"(Forgive me and) I will teach you some words with which Allah will benefit you.\" I asked, \"What are they?\" He replied, \"Whenever you go to bed, recite \"Ayat-al-Kursi\"-- 'Allahu la ilaha illa huwa-l-Haiy-ul Qaiyum' till you finish the whole verse. (If you do so), Allah will appoint a guard for you who will stay with you and no satan will come near you till morning. \" So, I released him. In the morning, Allah's Messenger (ﷺ) asked, \"What did your prisoner do yesterday?\" I replied, \"He claimed that he would teach me some words by which Allah will benefit me, so I let him go.\" Allah's Messenger (ﷺ) asked, \"What are they?\" I replied, \"He said to me, 'Whenever you go to bed, recite Ayat-al-Kursi from the beginning to the end ---- Allahu la ilaha illa huwa-lHaiy-ul-Qaiyum----.' He further said to me, '(If you do so), Allah will appoint a guard for you who will stay with you, and no satan will come near you till morning.' (Abu Huraira or another sub-narrator) added that they (the companions) were very keen to do good deeds. The Prophet (ﷺ) said, \"He really spoke the truth, although he is an absolute liar. Do you know whom you were talking to, these three nights, O Abu Huraira?\" Abu Huraira said, \"No.\" He said, \"It was Satan.\"", "grade": "Sahih", "match": 0.62}, "Sahih al-Bukhari 2736": {"ref": "Sahih al-Bukhari 2736", "url": "https://sunnah.com/bukhari:2736", "ar": "‏ إِنَّ لِلَّهِ تِسْعَةً وَتِسْعِينَ اسْمَا مِائَةً إِلاَّ وَاحِدًا مَنْ أَحْصَاهَا دَخَلَ الْجَنَّةَ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"Allah has ninety-nine names, i.e. one-hundred minus one, and whoever knows them will go to Paradise.\" (Please see Hadith No. 419 Vol. 8)", "grade": "Sahih", "match": 0.67}};

/* ================= Search ================= */
function searchKey(text) {

  const scored = new Map(), add = (d, s) => { if ((scored.get(d.id) || 0) < s) scored.set(d.id, s); };
  for (const [re, id] of ALIASES) if (re.test(lower)) add(BY_ID[id], 120);
  for (const { d, tk, ti } of INDEX) for (const k of keys) {
    if (k.length < 2) continue;
    if (tk.startsWith(k) || ti.startsWith(k)) add(d, 100 - (d.cat === "names" ? 5 : 0) - Math.min(20, tk.length / 10));

      if (d.tags.some(t => t === w || (t.length >= 4 && w.length >= 4 && (t.startsWith(w) || w.startsWith(t))))) s += 3;
      if (d.title.toLowerCase().includes(w)) s += 2;
      if (d.meaning.toLowerCase().includes(w)) s += 1;

  if (unchanged()) { it = findOrCreate(form.filled); it.target = form.target; }
  else { it = { id: uid(), title: form.title.trim(), arabic: form.arabic.trim(), translit: form.translit.trim(), translation: form.translation.trim(), source: "", target: form.target, count: 0, rounds: 0, total: 0, libraryID: null, createdAt: Date.now() }; S.items.push(it); }
  it.updated = Date.now(); save(); closeAdd(); ui.tab = "home"; ui.sub = null; render(); openCounter(it.id);
}

/* ================= Events ================= */
function rerenderKeepScroll() { const y = $screen.scrollTop; render(); $screen.scrollTop = y; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case "tab": if ($counter) closeCounter(); document.querySelectorAll(".overlay").forEach(closeOverlay); ui.tab = b.dataset.tab; ui.sub = null; render(true); $screen.scrollTop = 0; break;
    case "sub": ui.tab = "discover"; ui.sub = b.dataset.sub; render(true); $screen.scrollTop = 0; break;
    case "theme": S.theme = isLight() ? "dark" : "light"; save(); applyTheme(); rerenderKeepScroll(); break;
    case "open": openCounter(id); break;
    case "lib": openCounter(findOrCreate(BY_ID[id]).id); break;
    case "quickadd": {
      const d = BY_ID[id]; if (added(d)) toast("Already in My Zikr", d.title); else { findOrCreate(d).updated = Date.now(); save(); toast("Added to My Zikr", d.title); }
      rerenderKeepScroll(); break;
    }
    case "addall": { let n = 0; for (const d of momentSuggestion().items) if (!added(d)) { findOrCreate(d).updated = Date.now(); n++; } save(); toast(n ? `Added ${n} to My Zikr` : "All already in My Zikr", momentSuggestion().title); rerenderKeepScroll(); break; }
    case "period": ui.period = b.dataset.p; rerenderKeepScroll(); break;
    case "statopen": ui.statOpen = ui.statOpen === id ? null : id; rerenderKeepScroll(); break;
    case "reflect": openReflectionOverlay(+b.dataset.n, id, +b.dataset.tier); break;
    case "closeov": closeOverlay(b.closest(".overlay")); break;
    case "source": openSource(b.dataset.lib); break;
    case "closesrc": $layer.querySelectorAll(".sheet-src").forEach(x => x.remove()); $layer.querySelectorAll('.scrim[data-act="closesrc"]').forEach(x => x.remove()); break;
    case "add": openAdd(); break;
    case "closeadd": closeAdd(); break;
    case "kind": form.kind = b.dataset.kind; if (!form.filled) form.target = form.kind === "dua" ? 1 : 33; drawAdd(); break;
    case "pick": fill(BY_ID[id]); break;
    case "preset": form.target = +b.dataset.n; drawAdd(); break;
    case "save": saveAdd(); break;
    case "close": closeCounter(); break;
    case "sound": S.sound = !S.sound; save(); if (S.sound) tick(false); drawCounter(); break;
    case "menu": menuOpen = !menuOpen; drawCounter(); break;
    case "mode": S.mode = b.dataset.mode; save(); drawCounter(); break;
    case "openrefl": menuOpen = false; closeCounter(); ui.tab = "reflections"; render(true); break;
    case "undo": menuOpen = false; undo(current()); drawCounter(); break;
    case "resetround": menuOpen = false; current().count = 0; save(); drawCounter(); break;
    case "target": {
      menuOpen = false; const it = current(), opts = [1, 3, 7, 33, 99, 100, 1000], i = opts.indexOf(it.target);
      it.target = opts[(i + 1) % opts.length]; if (it.count >= it.target) it.count = 0; save(); drawCounter(); toast(`${it.target} per round`, it.title, hueOf(it.total).h, 1400); break;
    }
    case "delete": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to remove"; return; }
      menuOpen = false; const it = current(), its = counterItems(), idx = curIndex(); S.items = S.items.filter(x => x.id !== it.id); save();
      if (its.length > 1) { ui.counterId = its[(idx + 1) % its.length].id; drawCounter(); } else closeCounter();
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const o = [...document.querySelectorAll(".overlay")].pop(); if (o) return closeOverlay(o); if ($counter) closeCounter(); return; }
  if (!$counter || document.querySelector(".overlay") || e.target.closest("input, textarea")) return;
  if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); if (animating) return; if (ui.pending) collectPending(); else commitUp($counter.querySelector("#deck").clientHeight, 240); }
});
document.addEventListener("visibilitychange", () => { if ($counter && document.visibilityState === "visible") keepAwake(true); });
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { if (!S.theme) { applyTheme(); render(); } });
document.fonts?.ready?.then(() => $counter?.querySelectorAll(".card:not(.rcard-deck)").forEach(fitCard));
applyTheme(); render(true);
</script>

ddatan warahmatan inna fee thalika laayatin liqawmin yatafakkaroona", "surah": "Ar-Rum", "ref": "Ar-Rum 30:21"}, "30:22": {"ar": "وَمِنۡ ءَايَٰتِهِۦ خَلۡقُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَٱخۡتِلَٰفُ أَلۡسِنَتِكُمۡ وَأَلۡوَٰنِكُمۡۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتࣲ لِّلۡعَٰلِمِينَ", "en": "And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colors. Indeed in that are signs for those of knowledge", "tl": "Wamin ayatihi khalqu alssamawati waalardi waikhtilafu alsinatikum waalwanikum inna fee thalika laayatin lilAAalimeena", "surah": "Ar-Rum", "ref": "Ar-Rum 30:22"}, "30:48": {"ar": "ٱللَّهُ ٱلَّذِي يُرۡسِلُ ٱلرِّيَٰحَ فَتُثِيرُ سَحَابࣰا فَيَبۡسُطُهُۥ فِي ٱلسَّمَآءِ كَيۡفَ يَشَآءُ وَيَجۡعَلُهُۥ كِسَفࣰا فَتَرَى ٱلۡوَدۡقَ يَخۡرُجُ مِنۡ خِلَٰلِهِۦۖ فَإِذَآ أَصَابَ بِهِۦ مَن يَشَآءُ مِنۡ عِبَادِهِۦٓ إِذَا هُمۡ يَسۡتَبۡشِرُونَ", "en": "It is Allah who sends the winds, and they stir the clouds and spread them in the sky however He wills, and He makes them fragments so you see the rain emerge from within them. And when He causes it to fall upon whom He wills of His servants, immediately they rejoice", "tl": "Allahu allathee yursilu alrriyaha fatutheeru sahaban fayabsutuhu fee alssamai kayfa yashao wayajAAaluhu kisafan fatara alwadqa yakhruju min khilalihi faitha asaba bihi man yashao min AAibadihi itha hum yastabshiroona", "surah": "Ar-Rum", "ref": "Ar-Rum 30:48"}, "31:14": {"ar": "وَوَصَّيۡنَا ٱلۡإِنسَٰنَ بِوَٰلِدَيۡهِ حَمَلَتۡهُ أُمُّهُۥ وَهۡنًا عَلَىٰ وَهۡنࣲ وَفِصَٰلُهُۥ فِي عَامَيۡنِ أَنِ ٱشۡكُرۡ لِي وَلِوَٰلِدَيۡكَ إِلَيَّ ٱلۡمَصِيرُ", "en": "And We have enjoined upon man [care] for his parents. His mother carried him, [increasing her] in weakness upon weakness, and his weaning is in two years. Be grateful to Me and to your parents; to Me is the [final] destination", "tl": "Wawassayna alinsana biwalidayhi hamalathu ommuhu wahnan AAala wahnin wafisaluhu fee AAamayni ani oshkur lee waliwalidayka ilayya almaseeru", "surah": "Luqman", "ref": "Luqman 31:14"}, "36:40": {"ar": "لَا ٱلشَّمۡسُ يَنۢبَغِي لَهَآ أَن تُدۡرِكَ ٱلۡقَمَرَ وَلَا ٱلَّيۡلُ سَابِقُ ٱلنَّهَارِۚ وَكُلࣱّ فِي فَلَكࣲ يَسۡبَحُونَ", "en": "It is not allowable for the sun to reach the moon, nor does the night overtake the day, but each, in an orbit, is swimming", "tl": "La alshshamsu yanbaghee laha an tudrika alqamara wala allaylu sabiqu alnnahari wakullun fee falakin yasbahoona", "surah": "Ya-Sin", "ref": "Ya-Sin 36:40"}, "36:80": {"ar": "ٱلَّذِي جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلۡأَخۡضَرِ نَارࣰا فَإِذَآ أَنتُم مِّنۡهُ تُوقِدُونَ", "en": "[It is] He who made for you from the green tree, fire, and then from it you ignite", "tl": "Allathee jaAAala lakum mina alshshajari alakhdari naran faitha antum minhu tooqidoona", "surah": "Ya-Sin", "ref": "Ya-Sin 36:80"}, "39:53": {"ar": "۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ", "en": "Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful", "tl": "Qul ya AAibadiya allatheena asrafoo AAala anfusihim la taqnatoo min rahmati Allahi inna Allaha yaghfiru alththunooba jameeAAan innahu huwa alghafooru alrraheemu", "surah": "Az-Zumar", "ref": "Az-Zumar 39:53"}, "3:133": {"ar": "۞وَسَارِعُوٓاْ إِلَىٰ مَغۡفِرَةࣲ مِّن رَّبِّكُمۡ وَجَنَّةٍ عَرۡضُهَا ٱلسَّمَٰوَٰتُ وَٱلۡأَرۡضُ أُعِدَّتۡ لِلۡمُتَّقِينَ", "en": "And hasten to forgiveness from your Lord and a garden as wide as the heavens and earth, prepared for the righteous", "tl": "WasariAAoo ila maghfiratin min rabbikum wajannatin AAarduha alssamawatu waalardu oAAiddat lilmuttaqeena", "surah": "Ali 'Imran", "ref": "Ali 'Imran 3:133"}, "42:32": {"ar": "وَمِنۡ ءَايَٰتِهِ ٱلۡجَوَارِ فِي ٱلۡبَحۡرِ كَٱلۡأَعۡلَٰمِ", "en": "And of His signs are the ships in the sea, like mountains", "tl": "Wamin ayatihi aljawari fee albahri kaalaAAlami", "surah": "Ash-Shuraa", "ref": "Ash-Shuraa 42:32"}, "49:10": {"ar": "إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةࣱ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "en": "The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy", "tl": "Innama almuminoona ikhwatun faaslihoo bayna akhawaykum waittaqoo Allaha laAAallakum turhamoona", "surah": "Al-Hujurat", "ref": "Al-Hujurat 49:10"}, "50:9": {"ar": "وَنَزَّلۡنَا مِنَ ٱلسَّمَآءِ مَآءࣰ مُّبَٰرَكࣰا فَأَنۢبَتۡنَا بِهِۦ جَنَّـٰتࣲ وَحَبَّ ٱلۡحَصِيدِ", "en": "And We have sent down blessed rain from the sky and made grow thereby gardens and grain from the harvest", "tl": "Wanazzalna mina alssamai maan mubarakan faanbatna bihi jannatin wahabba alhaseedi", "surah": "Qaf", "ref": "Qaf 50:9"}, "51:47": {"ar": "وَٱلسَّمَآءَ بَنَيۡنَٰهَا بِأَيۡيْدࣲ وَإِنَّا لَمُوسِعُونَ", "en": "And the heaven We constructed with strength, and indeed, We are [its] expander", "tl": "Waalssamaa banaynaha biaydin wainna lamoosiAAoona", "surah": "Adh-Dhariyat", "ref": "Adh-Dhariyat 51:47"}, "51:49": {"ar": "وَمِن كُلِّ شَيۡءٍ خَلَقۡنَا زَوۡجَيۡنِ لَعَلَّكُمۡ تَذَكَّرُونَ", "en": "And of all things We created two mates; perhaps you will remember", "tl": "Wamin kulli shayin khalaqna zawjayni laAAallakum tathakkaroona", "surah": "Adh-Dhariyat", "ref": "Adh-Dhariyat 51:49"}, "53:43": {"ar": "وَأَنَّهُۥ هُوَ أَضۡحَكَ وَأَبۡكَىٰ", "en": "And that it is He who makes [one] laugh and weep", "tl": "Waannahu huwa adhaka waabka", "surah": "An-Najm", "ref": "An-Najm 53:43"}, "55:19-20": {"ar": "مَرَجَ ٱلۡبَحۡرَيۡنِ يَلۡتَقِيَانِ ﴿19﴾ بَيۡنَهُمَا بَرۡزَخࣱ لَّا يَبۡغِيَانِ ﴿20﴾", "en": "(19) He released the two seas, meeting [side by side] (20) Between them is a barrier [so] neither of them transgresses", "tl": "Maraja albahrayni yaltaqiyani Baynahuma barzakhun la yabghiyani", "surah": "Ar-Rahman", "ref": "Ar-Rahman 55:19–20"}, "57:25": {"ar": "لَقَدۡ أَرۡسَلۡنَا رُسُلَنَا بِٱلۡبَيِّنَٰتِ وَأَنزَلۡنَا مَعَهُمُ ٱلۡكِتَٰبَ وَٱلۡمِيزَانَ لِيَقُومَ ٱلنَّاسُ بِٱلۡقِسۡطِۖ وَأَنزَلۡنَا ٱلۡحَدِيدَ فِيهِ بَأۡسࣱ شَدِيدࣱ وَمَنَٰفِعُ لِلنَّاسِ وَلِيَعۡلَمَ ٱللَّهُ مَن يَنصُرُهُۥ وَرُسُلَهُۥ بِٱلۡغَيۡبِۚ إِنَّ ٱللَّهَ قَوِيٌّ عَزِيزࣱ", "en": "We have already sent Our messengers with clear evidences and sent down with them the Scripture and the balance that the people may maintain [their affairs] in justice. And We sent down iron, wherein is great military might and benefits for the people, and so that Allah may make evident those who support Him and His messengers unseen. Indeed, Allah is Powerful and Exalted in Might", "tl": "Laqad arsalna rusulana bialbayyinati waanzalna maAAahumu alkitaba waalmeezana liyaqooma alnnasu bialqisti waanzalna alhadeeda feehi basun shadeedun wamanafiAAu lilnnasi waliyaAAlama Allahu man yansuruhu warusulahu bialghaybi inna Allaha qawiyyun AAazeezun", "surah": "Al-Hadid", "ref": "Al-Hadid 57:25"}, "65:3": {"ar": "وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءࣲ قَدۡرࣰا", "en": "And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent", "tl": "Wayarzuqhu min haythu la yahtasibu waman yatawakkal AAala Allahi fahuwa hasbuhu inna Allaha balighu amrihi qad jaAAala Allahu likulli shayin qadran", "surah": "At-Talaq", "ref": "At-Talaq 65:3"}, "67:19": {"ar": "أَوَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ فَوۡقَهُمۡ صَـٰٓفَّـٰتࣲ وَيَقۡبِضۡنَۚ مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ إِنَّهُۥ بِكُلِّ شَيۡءِۭ بَصِيرٌ", "en": "Do they not see the birds above them with wings outspread and [sometimes] folded in? None holds them [aloft] except the Most Merciful. Indeed He is, of all things, Seeing", "tl": "Awalam yaraw ila alttayri fawqahum saffatin wayaqbidna ma yumsikuhunna illa alrrahmanu innahu bikulli shayin baseerun", "surah": "Al-Mulk", "ref": "Al-Mulk 67:19"}, "67:2": {"ar": "ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلࣰاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ", "en": "[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving", "tl": "Allathee khalaqa almawta waalhayata liyabluwakum ayyukum ahsanu AAamalan wahuwa alAAazeezu alghafooru", "surah": "Al-Mulk", "ref": "Al-Mulk 67:2"}, "6:95": {"ar": "۞إِنَّ ٱللَّهَ فَالِقُ ٱلۡحَبِّ وَٱلنَّوَىٰۖ يُخۡرِجُ ٱلۡحَيَّ مِنَ ٱلۡمَيِّتِ وَمُخۡرِجُ ٱلۡمَيِّتِ مِنَ ٱلۡحَيِّۚ ذَٰلِكُمُ ٱللَّهُۖ فَأَنَّىٰ تُؤۡفَكُونَ", "en": "Indeed, Allah is the cleaver of grain and date seeds. He brings the living out of the dead and brings the dead out of the living. That is Allah; so how are you deluded", "tl": "Inna Allaha faliqu alhabbi waalnnawa yukhriju alhayya mina almayyiti wamukhriju almayyiti mina alhayyi thalikumu Allahu faanna tufakoona", "surah": "Al-An'am", "ref": "Al-An'am 6:95"}, "6:97": {"ar": "وَهُوَ ٱلَّذِي جَعَلَ لَكُمُ ٱلنُّجُومَ لِتَهۡتَدُواْ بِهَا فِي ظُلُمَٰتِ ٱلۡبَرِّ وَٱلۡبَحۡرِۗ قَدۡ فَصَّلۡنَا ٱلۡأٓيَٰتِ لِقَوۡمࣲ يَعۡلَمُونَ", "en": "And it is He who placed for you the stars that you may be guided by them through the darknesses of the land and sea. We have detailed the signs for a people who know", "tl": "Wahuwa allathee jaAAala lakumu alnnujooma litahtadoo biha fee thulumati albarri waalbahri qad fassalna alayati liqawmin yaAAlamoona", "surah": "Al-An'am", "ref": "Al-An'am 6:97"}, "71:19": {"ar": "وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطࣰا", "en": "And Allah has made for you the earth an expanse", "tl": "WaAllahu jaAAala lakumu alarda bisatan", "surah": "Nuh", "ref": "Nuh 71:19"}, "75:4": {"ar": "بَلَىٰ قَٰدِرِينَ عَلَىٰٓ أَن نُّسَوِّيَ بَنَانَهُۥ", "en": "Yes. [We are] Able [even] to proportion his fingertips", "tl": "Bala qadireena AAala an nusawwiya bananahu", "surah": "Al-Qiyamah", "ref": "Al-Qiyamah 75:4"}, "78:10-11": {"ar": "وَجَعَلۡنَا ٱلَّيۡلَ لِبَاسࣰا ﴿10﴾ وَجَعَلۡنَا ٱلنَّهَارَ مَعَاشࣰا ﴿11﴾", "en": "(10) And made the night as clothing (11) And made the day for livelihood", "tl": "WajaAAalna allayla libasan WajaAAalna alnnahara maAAashan", "surah": "An-Naba", "ref": "An-Naba 78:10–11"}, "78:6-7": {"ar": "أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ مِهَٰدࣰا ﴿6﴾ وَٱلۡجِبَالَ أَوۡتَادࣰا ﴿7﴾", "en": "(6) Have We not made the earth a resting place (7) And the mountains as stakes", "tl": "Alam najAAali alarda mihadan Waaljibala awtadan", "surah": "An-Naba", "ref": "An-Naba 78:6–7"}, "78:9": {"ar": "وَجَعَلۡنَا نَوۡمَكُمۡ سُبَاتࣰا", "en": "And made your sleep [a means for] rest", "tl": "WajaAAalna nawmakum subatan", "surah": "An-Naba", "ref": "An-Naba 78:9"}, "7:156": {"ar": "۞وَٱكۡتُبۡ لَنَا فِي هَٰذِهِ ٱلدُّنۡيَا حَسَنَةࣰ وَفِي ٱلۡأٓخِرَةِ إِنَّا هُدۡنَآ إِلَيۡكَۚ قَالَ عَذَابِيٓ أُصِيبُ بِهِۦ مَنۡ أَشَآءُۖ وَرَحۡمَتِي وَسِعَتۡ كُلَّ شَيۡءࣲۚ فَسَأَكۡتُبُهَا لِلَّذِينَ يَتَّقُونَ وَيُؤۡتُونَ ٱلزَّكَوٰةَ وَٱلَّذِينَ هُم بِـَٔايَٰتِنَا يُؤۡمِنُونَ", "en": "And decree for us in this world [that which is] good and [also] in the Hereafter; indeed, we have turned back to You.\" [Allah] said, \"My punishment - I afflict with it whom I will, but My mercy encompasses all things.\" So I will decree it [especially] for those who fear Me and give zakah and those who believe in Our verses", "tl": "Waoktub lana fee hathihi alddunya hasanatan wafee alakhirati inna hudna ilayka qala AAathabee oseebu bihi man ashao warahmatee wasiAAat kulla shayin fasaaktubuha lillatheena yattaqoona wayutoona alzzakata waallatheena hum biayatina yuminoona", "surah": "Al-A'raf", "ref": "Al-A'raf 7:156"}, "7:180": {"ar": "وَلِلَّهِ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰ فَٱدۡعُوهُ بِهَاۖ وَذَرُواْ ٱلَّذِينَ يُلۡحِدُونَ فِيٓ أَسۡمَـٰٓئِهِۦۚ سَيُجۡزَوۡنَ مَا كَانُواْ يَعۡمَلُونَ", "en": "And to Allah belong the best names, so invoke Him by them. And leave [the company of] those who practice deviation concerning His names. They will be recompensed for what they have been doing", "tl": "Walillahi alasmao alhusna faodAAoohu biha watharoo allatheena yulhidoona fee asmaihi sayujzawna ma kanoo yaAAmaloona", "surah": "Al-A'raf", "ref": "Al-A'raf 7:180"}, "7:26": {"ar": "يَٰبَنِيٓ ءَادَمَ قَدۡ أَنزَلۡنَا عَلَيۡكُمۡ لِبَاسࣰا يُوَٰرِي سَوۡءَٰتِكُمۡ وَرِيشࣰاۖ وَلِبَاسُ ٱلتَّقۡوَىٰ ذَٰلِكَ خَيۡرࣱۚ ذَٰلِكَ مِنۡ ءَايَٰتِ ٱللَّهِ لَعَلَّهُمۡ يَذَّكَّرُونَ", "en": "O children of Adam, We have bestowed upon you clothing to conceal your private parts and as adornment. But the clothing of righteousness - that is best. That is from the signs of Allah that perhaps they will remember", "tl": "Ya banee adama qad anzalna AAalaykum libasan yuwaree sawatikum wareeshan walibasu alttaqwa thalika khayrun thalika min ayati Allahi laAAallahum yaththakkaroona", "surah": "Al-A'raf", "ref": "Al-A'raf 7:26"}, "80:24-25": {"ar": "فَلۡيَنظُرِ ٱلۡإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ ﴿24﴾ أَنَّا صَبَبۡنَا ٱلۡمَآءَ صَبࣰّا ﴿25﴾", "en": "(24) Then let mankind look at his food (25) How We poured down water in torrents", "tl": "Falyanthuri alinsanu ila taAAamihi Anna sababna almaa sabban", "surah": "'Abasa", "ref": "'Abasa 80:24–25"}, "88:17": {"ar": "أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ", "en": "Then do they not look at the camels - how they are created", "tl": "Afala yanthuroona ila alibili kayfa khuliqat", "surah": "Al-Ghashiyah", "ref": "Al-Ghashiyah 88:17"}, "89:1-2": {"ar": "وَٱلۡفَجۡرِ ﴿1﴾ وَلَيَالٍ عَشۡرࣲ ﴿2﴾", "en": "(1) By the dawn (2) And [by] ten nights", "tl": "Waalfajri Walayalin AAashrin", "surah": "Al-Fajr", "ref": "Al-Fajr 89:1–2"}, "93:9-10": {"ar": "فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ ﴿9﴾ وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ ﴿10﴾", "en": "(9) So as for the orphan, do not oppress [him] (10) And as for the petitioner, do not repel [him]", "tl": "Faamma alyateema fala taqhar Waamma alssaila fala tanhar", "surah": "Ad-Duhaa", "ref": "Ad-Duhaa 93:9–10"}, "94:5-6": {"ar": "فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا ﴿5﴾ إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرࣰا ﴿6﴾", "en": "(5) For indeed, with hardship [will be] ease (6) Indeed, with hardship [will be] ease", "tl": "Fainna maAAa alAAusri yusran Inna maAAa alAAusri yusran", "surah": "Ash-Sharh", "ref": "Ash-Sharh 94:5–6"}, "95:1-4": {"ar": "وَٱلتِّينِ وَٱلزَّيۡتُونِ ﴿1﴾ وَطُورِ سِينِينَ ﴿2﴾ وَهَٰذَا ٱلۡبَلَدِ ٱلۡأَمِينِ ﴿3﴾ لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمࣲ ﴿4﴾", "en": "(1) By the fig and the olive (2) And [by] Mount Sinai (3) And [by] this secure city [Makkah] (4) We have certainly created man in the best of stature", "tl": "Waaltteeni waalzzaytooni Watoori seeneena Wahatha albaladi alameeni Laqad khalaqna alinsana fee ahsani taqweemin", "surah": "At-Tin", "ref": "At-Tin 95:1–4"}, "96:3-5": {"ar": "ٱقۡرَأۡ وَرَبُّكَ ٱلۡأَكۡرَمُ ﴿3﴾ ٱلَّذِي عَلَّمَ بِٱلۡقَلَمِ ﴿4﴾ عَلَّمَ ٱلۡإِنسَٰنَ مَا لَمۡ يَعۡلَمۡ ﴿5﴾", "en": "(3) Recite, and your Lord is the most Generous (4) Who taught by the pen (5) Taught man that which he knew not", "tl": "Iqra warabbuka alakramu Allathee AAallama bialqalami AAallama alinsana ma lam yaAAlam", "surah": "Al-'Alaq", "ref": "Al-'Alaq 96:3–5"}};
const HADITH_SRC = {"Sunan Ibn Majah 1977": {"ref": "Sunan Ibn Majah 1977", "url": "https://sunnah.com/ibnmajah:1977", "ar": "‏ خَيْرُكُمْ خَيْرُكُمْ لأَهْلِهِ وَأَنَا خَيْرُكُمْ لأَهْلِي ‏", "narrator": "It was narrated from Ibn 'Abbas that:", "en": "the Prophet (ﷺ) said: \"The best of you is the one who is best to his wife, and I am the best of you to my wives.\"", "grade": "Hasan (Darussalam) ", "match": 1.0}, "Sahih al-Bukhari 5971": {"ref": "Sahih al-Bukhari 5971", "url": "https://sunnah.com/bukhari:5971", "ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ بْنِ شُبْرُمَةَ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ بِحُسْنِ صَحَابَتِي قَالَ ‏\"‏ أُمُّكَ ‏\"‏‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ أُمُّكَ ‏\"‏‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ أُمُّكَ ‏\"‏‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ ثُمَّ أَبُوكَ ‏\"‏‏.‏ وَقَالَ ابْنُ شُبْرُمَةَ وَيَحْيَى بْنُ أَيُّوبَ حَدَّثَنَا أَبُو زُرْعَةَ مِثْلَهُ‏.‏", "narrator": "Narrated Abu Huraira:", "en": "A man came to Allah's Messenger (ﷺ) and said, \"O Allah's Messenger (ﷺ) ! Who is more entitled to be treated with the best companionship by me?\" The Prophet (ﷺ) said, \"Your mother.\" The man said. \"Who is next?\" The Prophet (ﷺ) said, \"Your mother.\" The man further said, \"Who is next?\" The Prophet (ﷺ) said, \"Your mother.\" The man asked for the fourth time, \"Who is next?\" The Prophet (ﷺ) said, \"Your father. \"", "grade": "Sahih", "match": 0.43}, "Jami‘ at-Tirmidhi 1899": {"ref": "Jami‘ at-Tirmidhi 1899", "url": "https://sunnah.com/tirmidhi:1899", "ar": "‏ رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ وَسَخَطُ الرَّبِّ فِي سَخَطِ الْوَالِدِ ‏", "narrator": "Abdullah bin Amr narrated that:", "en": "the Prophet (ﷺ) said: \"The Lord's pleasure is in the parent's pleasure, and the Lord's anger is in the parent's anger.\"(Hasan).", "grade": "", "match": 0.6}, "Jami‘ at-Tirmidhi 3455": {"ref": "Jami‘ at-Tirmidhi 3455", "url": "https://sunnah.com/tirmidhi:3455", "ar": "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا عَلِيُّ بْنُ زَيْدٍ، عَنْ عُمَرَ، وَهُوَ ابْنُ أَبِي حَرْمَلَةَ عَنِ ابْنِ عَبَّاسٍ، قَالَ دَخَلْتُ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَا وَخَالِدُ بْنُ الْوَلِيدِ عَلَى مَيْمُونَةَ فَجَاءَتْنَا بِإِنَاءٍ مِنْ لَبَنٍ فَشَرِبَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَأَنَا عَلَى يَمِينِهِ وَخَالِدٌ عَلَى شِمَالِهِ فَقَالَ لِي ‏\"‏ الشَّرْبَةُ لَكَ فَإِنْ شِئْتَ آثَرْتَ بِهَا خَالِدًا ‏\"‏ ‏.‏ فَقُلْتُ مَا كُنْتُ أُوثِرُ عَلَى سُؤْرِكَ أَحَدًا ‏.‏ ثُمَّ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ مَنْ أَطْعَمَهُ اللَّهُ الطَّعَامَ فَلْيَقُلِ اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَأَطْعِمْنَا خَيْرًا مِنْهُ ‏.‏ وَمَنْ سَقَاهُ اللَّهُ لَبَنًا فَلْيَقُلِ اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ ‏\"‏ ‏.‏ وَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ لَيْسَ شَيْءٌ يَجْزِي مَكَانَ الطَّعَامِ وَالشَّرَابِ غَيْرُ اللَّبَنِ ‏\"‏ ‏.‏ قَالَ هَذَا حَدِيثٌ حَسَنٌ ‏.‏ وَقَدْ رَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ عَنْ عَلِيِّ بْنِ زَيْدٍ فَقَالَ عَنْ عُمَرَ بْنِ حَرْمَلَةَ ‏.‏ وَقَالَ بَعْضُهُمْ عَمْرُو بْنُ حَرْمَلَةَ وَلاَ يَصِحُّ ‏.‏", "narrator": "Ibn Abbas narrated:", "en": "“I entered with the Messenger of Allah (ﷺ), I and Khalid bin Al-Walid, upon Maimunah so she brought us a vessel of milk. The Messenger of Allah (ﷺ) drank from it. I was upon his right and Khalid was upon left, so he said to me: ‘The (turn to) drink is for you, so if you wish, you could choose to grant it to Khalid.’ So I said: ‘I would not prefer anyone (above myself) for your leftovers.’ Then the Messenger of Allah (ﷺ) said: ‘Whoever Allah feeds some food, then let him say: “O Allah, bless it for us, and feed us better than it, (Allāhumma bārik lanā fīhi wa aṭ`imnā khairan minhu)” and whomsoever Allah gives milk to drink, then let him say: “O Allah bless it for us, and grant us increase in it (Allāhumma bārik lanā fīhi wa zidnā minhu).” And the Messenger of Allah (ﷺ) said, ‘There is nothing that suffices in the place of food and drink except for milk.’”", "grade": "Da’if (Darussalam) ", "match": 0.33}, "Sahih al-Bukhari 4569": {"ref": "Sahih al-Bukhari 4569", "url": "https://sunnah.com/bukhari:4569", "ar": "حَدَّثَنَا سَعِيدُ بْنُ أَبِي مَرْيَمَ، أَخْبَرَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ أَخْبَرَنِي شَرِيكُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ كُرَيْبٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ بِتُّ عِنْدَ خَالَتِي مَيْمُونَةَ، فَتَحَدَّثَ رَسُولُ اللَّهِ صلى الله عليه وسلم مَعَ أَهْلِهِ سَاعَةً ثُمَّ رَقَدَ، فَلَمَّا كَانَ ثُلُثُ اللَّيْلِ الآخِرُ قَعَدَ فَنَظَرَ إِلَى السَّمَاءِ فَقَالَ ‏{‏إِنَّ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لآيَاتٍ لأُولِي الأَلْبَابِ‏}‏، ثُمَّ قَامَ فَتَوَضَّأَ وَاسْتَنَّ، فَصَلَّى إِحْدَى عَشْرَةَ رَكْعَةً، ثُمَّ أَذَّنَ بِلاَلٌ فَصَلَّى رَكْعَتَيْنِ، ثُمَّ خَرَجَ فَصَلَّى الصُّبْحَ‏.‏", "narrator": "Narrated Ibn `Abbas:", "en": "I stayed overnight in the house of my aunt Maimuna. Allah's Messenger (ﷺ) talked with his wife for a while and then went to bed. When it was the last third of the night, he got up and looked towards the sky and said: \"Verily! In the creation of the Heavens and the Earth and in the alteration of night and day, there are indeed signs for men of understanding.\" (3:190) Then he stood up, performed ablution, brushed his teeth with a Siwak, and then prayed eleven rak`at. Then Bilal pronounced the Adhan (i.e. call for the Fajr prayer). The Prophet (ﷺ) then offered two rak`at (Sunna) prayer and went out (to the Mosque) and offered the (compulsory congregational) Fajr prayer.", "grade": "Sahih", "match": 0.58}, "Sahih al-Bukhari 5684": {"ref": "Sahih al-Bukhari 5684", "url": "https://sunnah.com/bukhari:5684", "ar": "حَدَّثَنَا عَيَّاشُ بْنُ الْوَلِيدِ، حَدَّثَنَا عَبْدُ الأَعْلَى، حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ، عَنْ أَبِي سَعِيدٍ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ صلى الله عليه وسلم فَقَالَ أَخِي يَشْتَكِي بَطْنَهُ‏.‏ فَقَالَ ‏\"‏ اسْقِهِ عَسَلاً ‏\"‏‏.‏ ثُمَّ أَتَى الثَّانِيَةَ فَقَالَ ‏\"‏ اسْقِهِ عَسَلاً ‏\"‏‏.‏ ثُمَّ أَتَاهُ فَقَالَ فَعَلْتُ‏.‏ فَقَالَ ‏\"‏ صَدَقَ اللَّهُ، وَكَذَبَ بَطْنُ أَخِيكَ، اسْقِهِ عَسَلاً ‏\"‏‏.‏ فَسَقَاهُ فَبَرَأَ‏.‏", "narrator": "Narrated Abu Sa`id Al-Khudri:", "en": "A man came to the Prophet (ﷺ) and said, \"My brother has some Abdominal trouble.\" The Prophet (ﷺ) said to him \"Let him drink honey.\" The man came for the second time and the Prophet (ﷺ) said to him, 'Let him drink honey.\" He came for the third time and the Prophet (ﷺ) said, \"Let him drink honey.\" He returned again and said, \"I have done that ' The Prophet (ﷺ) then said, \"Allah has said the truth, but your brother's `Abdomen has told a lie. Let him drink honey.\" So he made him drink honey and he was cured.", "grade": "Sahih", "match": 0.31}, "Jami‘ at-Tirmidhi 2517": {"ref": "Jami‘ at-Tirmidhi 2517", "url": "https://sunnah.com/tirmidhi:2517", "ar": "‏ اعْقِلْهَا وَتَوَكَّلْ ‏", "narrator": "Anas bin Malik narrated that a man said:", "en": "\"O Messenger of Allah! Shall I tie it and rely(upon Allah), or leave it loose and rely(upon Allah)?\" He said: \"Tie it and rely(upon Allah).\" Other chains report similar narrations.", "grade": "Hasan (Darussalam) ", "match": 0.17}, "Sahih al-Bukhari 1032": {"ref": "Sahih al-Bukhari 1032", "url": "https://sunnah.com/bukhari:1032", "ar": "‏ صَيِّبًا نَافِعًا ‏", "narrator": "Narrated Aisha:", "en": "Whenever Allah's Messenger (ﷺ) saw the rain, he used to say, \"O Allah! Let it be a strong fruitful rain.\"", "grade": "Sahih", "match": 0.17}, "Jami‘ at-Tirmidhi 2344": {"ref": "Jami‘ at-Tirmidhi 2344", "url": "https://sunnah.com/tirmidhi:2344", "ar": "‏ لَوْ أَنَّكُمْ كُنْتُمْ تَوَكَّلُونَ عَلَى اللَّهِ حَقَّ تَوَكُّلِهِ لَرُزِقْتُمْ كَمَا تُرْزَقُ الطَّيْرُ تَغْدُو خِمَاصًا وَتَرُوحُ بِطَانًا ‏", "narrator": "'Umar bin Al-Khattab narrated that the Messenger of Allah (ﷺ) said:", "en": "\"If you were to rely upon Allah with the required reliance, then He would provide for you just as a bird is provided for, it goes out in the morning empty, and returns full.\"", "grade": "Hasan (Darussalam) ", "match": 0.27}, "Sahih Muslim 2963": {"ref": "Sahih Muslim 2963 c", "url": "https://sunnah.com/muslim:2963c", "ar": "وَحَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا جَرِيرٌ، ح وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ،\nح وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، - وَاللَّفْظُ لَهُ - حَدَّثَنَا أَبُو مُعَاوِيَةَ، وَوَكِيعٌ، عَنِ الأَعْمَشِ،\nعَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ انْظُرُوا إِلَى\nمَنْ أَسْفَلَ مِنْكُمْ وَلاَ تَنْظُرُوا إِلَى مَنْ هُوَ فَوْقَكُمْ فَهُوَ أَجْدَرُ أَنْ لاَ تَزْدَرُوا نِعْمَةَ اللَّهِ ‏\"‏ ‏.‏ قَالَ\nأَبُو مُعَاوِيَةَ ‏\"‏ عَلَيْكُمْ ‏\"‏ ‏.‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "Look at those who stand at a lower level than you but don't look at those who stand at a higher level than you, for that is better-suited that you do not disparage Allah's favors. In the chain narrated by Abu Mu'awiya's he said: Upon you.", "grade": "Sahih", "match": 0.33}, "Sahih al-Bukhari 1041": {"ref": "Sahih al-Bukhari 1041", "url": "https://sunnah.com/bukhari:1041", "ar": "‏ إِنَّ الشَّمْسَ وَالْقَمَرَ لاَ يَنْكَسِفَانِ لِمَوْتِ أَحَدٍ مِنَ النَّاسِ، وَلَكِنَّهُمَا آيَتَانِ مِنْ آيَاتِ اللَّهِ، فَإِذَا رَأَيْتُمُوهُمَا فَقُومُوا فَصَلُّوا ‏", "narrator": "Narrated Abu Mas`ud:", "en": "The Prophet (ﷺ) said, \"The sun and the moon do not eclipse because of the death of someone from the people but they are two signs amongst the signs of Allah. When you see them stand up and pray.\"", "grade": "Sahih", "match": 0.6}, "Sahih al-Bukhari 4084": {"ref": "Sahih al-Bukhari 4084", "url": "https://sunnah.com/bukhari:4084", "ar": "‏ هَذَا جَبَلٌ يُحِبُّنَا وَنُحِبُّهُ، اللَّهُمَّ إِنَّ إِبْرَاهِيمَ حَرَّمَ مَكَّةَ، وَإِنِّي حَرَّمْتُ مَا بَيْنَ لاَبَتَيْهَا ‏", "narrator": "Narrated Anas bin Malik:", "en": "When the mountain of Uhud appeared before Allah's Messenger (ﷺ) he said, \"This IS a mountain that loves us and is loved by us. O, Allah! Abraham made Mecca a Sanctuary, and I have made Medina (i.e. the area between its two mountains) a Sanctuary as well.\"", "grade": "Sahih", "match": 0.6}, "Sunan Abi Dawud 83": {"ref": "Sunan Abi Dawud 83", "url": "https://sunnah.com/abudawud:83", "ar": "‏ هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ ‏", "narrator": "Narrated AbuHurayrah:", "en": "A man asked the Messenger of Allah (ﷺ): Messenger of Allah, we travel on the sea and take a small quantity of water with us. If we use this for ablution, we would suffer from thirst. Can we perform ablution with sea water? The Messenger (ﷺ) replied: Its water is pure and what dies in it is lawful food.", "grade": "Sahih (Al-Albani) ", "match": 0.57}, "Sunan Abi Dawud 3477": {"ref": "Sunan Abi Dawud 3477", "url": "https://sunnah.com/abudawud:3477", "ar": "‏ الْمُسْلِمُونَ شُرَكَاءُ فِي ثَلاَثٍ فِي الْكَلإِ وَالْمَاءِ وَالنَّارِ ‏", "narrator": "Narrated A man:", "en": "A man from the immigrants of the Companions of the Prophet (ﷺ) said: I participated in battle three times along with the Prophet (ﷺ). I heard him say: Muslims have common share in three (things). grass, water and fire.", "grade": "Sahih (Al-Albani) ", "match": 0.71}, "Sahih al-Bukhari 5376": {"ref": "Sahih al-Bukhari 5376", "url": "https://sunnah.com/bukhari:5376", "ar": "‏ يَا غُلاَمُ سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ ‏", "narrator": "Narrated `Umar bin Abi Salama:", "en": "I was a boy under the care of Allah's Messenger (ﷺ) and my hand used to go around the dish while I was eating. So Allah's Messenger (ﷺ) said to me, 'O boy! Mention the Name of Allah and eat with your right hand, and eat of the dish what is nearer to you.\" Since then I have applied those instructions when eating.", "grade": "Sahih", "match": 0.5}, "Al-Adab al-Mufrad 479": {"ref": "Al-Adab al-Mufrad 479", "url": "https://sunnah.com/adab:479", "ar": "حَدَّثَنَا أَبُو الْوَلِيدِ، قَالَ‏:‏ حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ هِشَامِ بْنِ زَيْدِ بْنِ أَنَسِ بْنِ مَالِكٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ‏:‏ إِنْ قَامَتِ السَّاعَةُ وَفِي يَدِ أَحَدِكُمْ فَسِيلَةٌ، فَإِنِ اسْتَطَاعَ أَنْ لاَ تَقُومَ حَتَّى يَغْرِسَهَا فَلْيَغْرِسْهَا‏.‏", "narrator": "", "en": "Anas ibn Malik reported that the Prophet, (ﷺ), said, \"If the Final Hour comes while you have a shoot of a plant in your hands and it is possible to plant it before the Hour comes, you should plant it.\"", "grade": "Sahih (Al-Albani) ", "match": 0.29}, "Sahih al-Bukhari 247": {"ref": "Sahih al-Bukhari 247", "url": "https://sunnah.com/bukhari:247", "ar": "حَدَّثَنَا مُحَمَّدُ بْنُ مُقَاتِلٍ، قَالَ أَخْبَرَنَا عَبْدُ اللَّهِ، قَالَ أَخْبَرَنَا سُفْيَانُ، عَنْ مَنْصُورٍ، عَنْ سَعْدِ بْنِ عُبَيْدَةَ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلاَةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الأَيْمَنِ، ثُمَّ قُلِ اللَّهُمَّ أَسْلَمْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لاَ مَلْجَأَ وَلاَ مَنْجَا مِنْكَ إِلاَّ إِلَيْكَ، اللَّهُمَّ آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ‏.‏ فَإِنْ مُتَّ مِنْ لَيْلَتِكَ فَأَنْتَ عَلَى الْفِطْرَةِ، وَاجْعَلْهُنَّ آخِرَ مَا تَتَكَلَّمُ بِهِ ‏\"‏‏.‏ قَالَ فَرَدَّدْتُهَا عَلَى النَّبِيِّ صلى الله عليه وسلم فَلَمَّا بَلَغْتُ ‏\"‏ اللَّهُمَّ آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ ‏\"‏‏.‏ قُلْتُ وَرَسُولِكَ‏.‏ قَالَ ‏\"‏ لاَ، وَنَبِيِّكَ الَّذِي أَرْسَلْتَ ‏\"‏‏.‏", "narrator": "Narrated Al-Bara 'bin `Azib:", "en": "The Prophet (ﷺ) said to me, \"Whenever you go to bed perform ablution like that for the prayer, lie or your right side and say, \"Allahumma aslamtu wajhi ilaika, wa fauwadtu `Amri ilaika, wa alja'tu Zahri ilaika raghbatan wa rahbatan ilaika. La Malja'a wa la manja minka illa ilaika. Allahumma amantu bikitabika-l-ladhi anzalta wa bina-biyika-l ladhi arsalta\" (O Allah! I surrender to You and entrust all my affairs to You and depend upon You for Your Blessings both with hope and fear of You. There is no fleeing from You, and there is no place of protection and safety except with You O Allah! I believe in Your Book (the Qur'an) which You have revealed and in Your Prophet (Muhammad) whom You have sent). Then if you die on that very night, you will die with faith (i.e. or the religion of Islam). Let the aforesaid words be your last utterance (before sleep).\" I repeated it before the Prophet (ﷺ) and when I reached \"Allahumma amantu bikitabika-l-ladhi anzalta (O Allah I believe in Your Book which You have revealed).\" I said, \"Wa-rasulika (and your Messenger).\" The Prophet (ﷺ) said, \"No, (but say): 'Wanabiyika-l-ladhi arsalta (Your Prophet (ﷺ) whom You have sent), instead.\"", "grade": "Sahih", "match": 0.56}, "Sunan Abi Dawud 5097": {"ref": "Sunan Abi Dawud 5097", "url": "https://sunnah.com/abudawud:5097", "ar": "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدٍ الْمَرْوَزِيُّ، وَسَلَمَةُ، - يَعْنِي ابْنَ شَبِيبٍ - قَالاَ حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنِي ثَابِتُ بْنُ قَيْسٍ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ الرِّيحُ مِنْ رَوْحِ اللَّهِ ‏\"‏ ‏.‏ قَالَ سَلَمَةُ فَرَوْحُ اللَّهِ تَأْتِي بِالرَّحْمَةِ وَتَأْتِي بِالْعَذَابِ فَإِذَا رَأَيْتُمُوهَا فَلاَ تَسُبُّوهَا وَسَلُوا اللَّهَ خَيْرَهَا وَاسْتَعِيذُوا بِاللَّهِ مِنْ شَرِّهَا ‏\"‏ ‏.‏", "narrator": "Narrated AbuHurayrah:", "en": "I heard the Messenger of Allah (ﷺ) say: The wind comes from Allah's mercy. Salamah's version has: It is Allah's mercy; it (sometimes) brings blessing and (sometimes) brings punishment. So when you see it, do not revile it, but ask Allah for some of its good, and seek refuge in Allah from its evil.", "grade": "Sahih (Al-Albani) ", "match": 0.78}, "Jami‘ at-Tirmidhi 1919": {"ref": "Jami‘ at-Tirmidhi 1919", "url": "https://sunnah.com/tirmidhi:1919", "ar": "‏ لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا ‏", "narrator": "Anas bin Malik narrated that:", "en": "\"An older man came to talk to the Prophet, and the people were hesitant to make room for him. The Prophet (ﷺ) said: ;He is not one of us who does not have mercy on our young and does not respect our elders.\"", "grade": "Hasan (Darussalam) ", "match": 0.83}, "Sahih Muslim 2564": {"ref": "Sahih Muslim 2564 c", "url": "https://sunnah.com/muslim:2564c", "ar": "‏ إِنَّ اللَّهَ لاَ يَنْظُرُ إِلَى\nصُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ ‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "Verily Allah does not look to your faces and your wealth but He looks to your heart and to your deeds.", "grade": "Sahih", "match": 0.71}, "Sahih al-Bukhari 6407": {"ref": "Sahih al-Bukhari 6407", "url": "https://sunnah.com/bukhari:6407", "ar": "‏ مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لاَ يَذْكُرُ مَثَلُ الْحَىِّ وَالْمَيِّتِ ‏", "narrator": "Narrated Abu Musa:", "en": "The Prophet (ﷺ) said, \"The example of the one who celebrates the Praises of his Lord (Allah) in comparison to the one who does not celebrate the Praises of his Lord, is that of a living creature compared to a dead one.\"", "grade": "Sahih", "match": 0.71}, "Sahih al-Bukhari 6412": {"ref": "Sahih al-Bukhari 6412", "url": "https://sunnah.com/bukhari:6412", "ar": "‏ نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ، الصِّحَّةُ وَالْفَرَاغُ ‏", "narrator": "Narrated Ibn `Abbas:", "en": "The Prophet (ﷺ) said: \"There are two blessings that many people are deceived into losing: health and free time.\"", "grade": "Sahih", "match": 0.86}, "Sahih al-Bukhari 6000": {"ref": "Sahih al-Bukhari 6000", "url": "https://sunnah.com/bukhari:6000", "ar": "‏ جَعَلَ اللَّهُ الرَّحْمَةَ مِائَةَ جُزْءٍ، فَأَمْسَكَ عِنْدَهُ تِسْعَةً وَتِسْعِينَ جُزْءًا، وَأَنْزَلَ فِي الأَرْضِ جُزْءًا وَاحِدًا، فَمِنْ ذَلِكَ الْجُزْءِ يَتَرَاحَمُ الْخَلْقُ، حَتَّى تَرْفَعَ الْفَرَسُ حَافِرَهَا عَنْ وَلَدِهَا خَشْيَةَ أَنْ تُصِيبَهُ ‏", "narrator": "Narrated Abu Huraira:", "en": "I heard Allah's Messenger (ﷺ) saying, Allah divided Mercy into one hundred parts. He kept ninety nine parts with Him and sent down one part to the earth, and because of that, its one single part, His Creations are merciful to each other, so that even the mare lifts up its hoofs away from its baby animal, lest it should trample on it.\"", "grade": "Sahih", "match": 0.75}, "Sunan Abi Dawud 1488": {"ref": "Sunan Abi Dawud 1488", "url": "https://sunnah.com/abudawud:1488", "ar": "‏ إِنَّ رَبَّكُمْ تَبَارَكَ وَتَعَالَى حَيِيٌّ كَرِيمٌ يَسْتَحْيِي مِنْ عَبْدِهِ إِذَا رَفَعَ يَدَيْهِ إِلَيْهِ أَنْ يَرُدَّهُمَا صِفْرًا ‏", "narrator": "Narrated Salman al-Farsi:", "en": "The Prophet (ﷺ) said: Your Lord is munificent and generous, and is ashamed to turn away empty the hands of His servant when he raises them to Him.", "grade": "Sahih (Al-Albani) ", "match": 0.86}, "Sahih al-Bukhari 7405": {"ref": "Sahih al-Bukhari 7405", "url": "https://sunnah.com/bukhari:7405", "ar": "‏ يَقُولُ اللَّهُ تَعَالَى أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي، فَإِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي، وَإِنْ ذَكَرَنِي فِي مَلأٍ ذَكَرْتُهُ فِي مَلأٍ خَيْرٍ مِنْهُمْ، وَإِنْ تَقَرَّبَ إِلَىَّ بِشِبْرٍ تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا، وَإِنْ تَقَرَّبَ إِلَىَّ ذِرَاعًا تَقَرَّبْتُ إِلَيْهِ بَاعًا، وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً ‏", "narrator": "Narrated Abu Huraira:", "en": "The Prophet (ﷺ) said, \"Allah says: 'I am just as My slave thinks I am, (i.e. I am able to do for him what he thinks I can do for him) and I am with him if He remembers Me. If he remembers Me in himself, I too, remember him in Myself; and if he remembers Me in a group of people, I remember him in a group that is better than they; and if he comes one span nearer to Me, I go one cubit nearer to him; and if he comes one cubit nearer to Me, I go a distance of two outstretched arms nearer to him; and if he comes to Me walking, I go to him running.' \"", "grade": "Sahih", "match": 0.67}, "Sahih al-Bukhari 1469": {"ref": "Sahih al-Bukhari 1469", "url": "https://sunnah.com/bukhari:1469", "ar": "‏ مَا يَكُونُ عِنْدِي مِنْ خَيْرٍ فَلَنْ أَدَّخِرَهُ عَنْكُمْ، وَمَنْ يَسْتَعْفِفْ يُعِفَّهُ اللَّهُ، وَمَنْ يَسْتَغْنِ يُغْنِهِ اللَّهُ، وَمَنْ يَتَصَبَّرْ يُصَبِّرْهُ اللَّهُ، وَمَا أُعْطِيَ أَحَدٌ عَطَاءً خَيْرًا وَأَوْسَعَ مِنَ الصَّبْرِ ‏", "narrator": "Narrated Abu Sa`id Al-Khudri:", "en": "Some Ansari persons asked for (something) from Allah's Messenger (ﷺ) and he gave them. They again asked him for (something) and he again gave them. And then they asked him and he gave them again till all that was with him finished. And then he said \"If I had anything. I would not keep it away from you. (Remember) Whoever abstains from asking others, Allah will make him contented, and whoever tries to make himself self-sufficient, Allah will make him self-sufficient. And whoever remains patient, Allah will make him patient. Nobody can be given a blessing better and greater than patience.\"", "grade": "Sahih", "match": 0.43}, "Sahih Muslim 2588": {"ref": "Sahih Muslim 2588", "url": "https://sunnah.com/muslim:2588", "ar": "‏ مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ عِزًّا وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ رَفَعَهُ\nاللَّهُ ‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "Charity does not decrease wealth, no one forgives another except that Allah increases his honor, and no one humbles himself for the sake of Allah except that Allah raises his status.", "grade": "Sahih", "match": 1.0}, "Sahih Muslim 2699": {"ref": "Sahih Muslim 2699 a", "url": "https://sunnah.com/muslim:2699a", "ar": "‏ مَنْ نَفَّسَ عَنْ\nمُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ\nيَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالآخِرَةِ وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالآخِرَةِ وَاللَّهُ\nفِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ\nلَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ\nبَيْنَهُمْ إِلاَّ نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ وَحَفَّتْهُمُ الْمَلاَئِكَةُ وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ\nوَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ ‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "He who alleviates the suffering of a brother out of the sufferings of the world, Allah would alleviate his suffering from the sufferings of the Day of Resurrection, and he who finds relief for one who is hard-pressed, Allah would make things easy for him in the Hereafter, and he who conceals (the faults) of a Muslim, Allah would conceal his faults in the world and in the Hereafter. Allah is at the back of a servant so long as the servant is at the back of his brother, and he who treads the path in search of knowledge, Allah would make that path easy, leading to Paradise for him and those persons who assemble in the house among the houses of Allah (mosques) and recite the Book of Allah and they learn and teach the Qur'an (among themselves) there would descend upon them tranquility and mercy would cover them and the angels would surround them and Allah mentions them in the presence of those near Him, and he who is slow-paced in doing good deeds, his (high) lineage does not make him go ahead.", "grade": "Sahih", "match": 0.5}, "Sahih Muslim 2586": {"ref": "Sahih Muslim 2586 a", "url": "https://sunnah.com/muslim:2586a", "ar": "‏ مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ\nوَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ\nوَالْحُمَّى ‏", "narrator": "Nu'man b. Bashir reported Allah's Messenger (ﷺ) as saying:", "en": "The similitude of believers in regard to mutual love, affection, fellow-feeling is that of one body; when any limb of it aches, the whole body aches, because of sleeplessness and fever.", "grade": "Sahih", "match": 0.54}, "Sahih Muslim 725": {"ref": "Sahih Muslim 725 a", "url": "https://sunnah.com/muslim:725a", "ar": "‏ رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا ‏", "narrator": "'A'isha reported Allah's Messenger (ﷺ)  as saying:", "en": "The two rak'ahs at dawn are better than this world and what it contains.", "grade": "Sahih", "match": 0.5}, "Sahih al-Bukhari 660": {"ref": "Sahih al-Bukhari 660", "url": "https://sunnah.com/bukhari:660", "ar": "‏ سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ يَوْمَ لاَ ظِلَّ إِلاَّ ظِلُّهُ الإِمَامُ الْعَادِلُ، وَشَابٌّ نَشَأَ فِي عِبَادَةِ رَبِّهِ، وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ فِي الْمَسَاجِدِ، وَرَجُلاَنِ تَحَابَّا فِي اللَّهِ اجْتَمَعَا عَلَيْهِ وَتَفَرَّقَا عَلَيْهِ، وَرَجُلٌ طَلَبَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ فَقَالَ إِنِّي أَخَافُ اللَّهَ‏.‏ وَرَجُلٌ تَصَدَّقَ أَخْفَى حَتَّى لاَ تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ، وَرَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاهُ ‏", "narrator": "Narrated Abu Huraira:", "en": "The Prophet (ﷺ) said, \"Allah will give shade, to seven, on the Day when there will be no shade but His. (These seven persons are) a just ruler, a youth who has been brought up in the worship of Allah (i.e. worships Allah sincerely from childhood), a man whose heart is attached to the mosques (i.e. to pray the compulsory prayers in the mosque in congregation), two persons who love each other only for Allah's sake and they meet and part in Allah's cause only, a man who refuses the call of a charming woman of noble birth for illicit intercourse with her and says: I am afraid of Allah, a man who gives charitable gifts so secretly that his left hand does not know what his right hand has given (i.e. nobody knows how much he has given in charity), and a person who remembers Allah in seclusion and his eyes are then flooded with tears.\"", "grade": "Sahih", "match": 0.5}, "Sahih Muslim 2715": {"ref": "Sahih Muslim 2715", "url": "https://sunnah.com/muslim:2715", "ar": "‏ الْحَمْدُ\nلِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا فَكَمْ مِمَّنْ لاَ كَافِيَ لَهُ وَلاَ مُئْوِيَ ‏", "narrator": "Anas reported Allah's Messenger (ﷺ) as saying:", "en": "When you go to bed, say:\" Praise is due to Allah Who fed us, provided us drink, sufficed us and provided us with shelter, for many a people there is none to suffice and none to provide shelter.\"", "grade": "Sahih", "match": 0.67}, "Sunan Abi Dawud 4023": {"ref": "Sunan Abi Dawud 4023", "url": "https://sunnah.com/abudawud:4023", "ar": "‏ مَنْ أَكَلَ طَعَامًا ثُمَّ قَالَ الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا الطَّعَامَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ وَمَنْ لَبِسَ ثَوْبًا فَقَالَ الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ ‏", "narrator": "Narrated Mu'adh ibn Anas:", "en": "The Prophet (ﷺ) said: If anyone eats food and then says: \"Praise be to Allah Who has fed me with this food and provided me with it through no might and power on my part,\" he will be forgiven his former and later sins. If anyone puts on a garment and says: \"Praise be to Allah Who has clothed me with this and provided me with it through no might and power on my part,\" he will be forgiven his former and later sins.", "grade": "حسن دون زيادة وما تأخر (الألباني) ", "match": 0.25}, "Sahih Muslim 2664": {"ref": "Sahih Muslim 2664", "url": "https://sunnah.com/muslim:2664", "ar": "‏ الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ\nوَفِي كُلٍّ خَيْرٌ احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجِزْ وَإِنْ أَصَابَكَ شَىْءٌ فَلاَ تَقُلْ\nلَوْ أَنِّي فَعَلْتُ كَانَ كَذَا وَكَذَا ‏.‏ وَلَكِنْ قُلْ قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ\n‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "A strong believer is better and is more lovable to Allah than a weak believer, and there is good in everyone, (but) cherish that which gives you benefit (in the Hereafter) and seek help from Allah and do not lose heart, and if anything (in the form of trouble) comes to you, don't say: If I had not done that, it would not have happened so and so, but say: Allah did that what He had ordained to do and your\" if\" opens the (gate) for the Satan.", "grade": "Sahih", "match": 0.67}, "Jami‘ at-Tirmidhi 1851": {"ref": "Jami‘ at-Tirmidhi 1851", "url": "https://sunnah.com/tirmidhi:1851", "ar": "‏ كُلُوا الزَّيْتَ وَادَّهِنُوا بِهِ فَإِنَّهُ مِنْ شَجَرَةٍ مُبَارَكَةٍ ‏", "narrator": "Narrated 'Umar bin Al-Khattab:", "en": "That the Messenger of Allah (ﷺ) said: \"Eat olive and use its oil, for indeed it is a blessed tree.\" [Abu 'Eisa said:] We do not know of this Hadith except through the narration of 'Abdur-Razzaq from Ma'mar (narrators in the chain of this Hadith). 'Abdur-Razzaq would narrate this with Idtirab. Sometimes he mentioned in it: \"From 'Umar, from the Prophet (ﷺ)\" and sometimes he reported it indicating doubt, saying: \"I think it is from 'Umar from the Prophet (ﷺ).\" And sometimes he said: \"From Zaid bin Aslam, from his father, from the Prophet (ﷺ)\" in a Mursal form.", "grade": "Sahih (Darussalam) ", "match": 0.5}, "Sahih al-Bukhari 6316": {"ref": "Sahih al-Bukhari 6316", "url": "https://sunnah.com/bukhari:6316", "ar": "‏ اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ يَسَارِي نُورًا، وَفَوْقِي نُورًا، وَتَحْتِي نُورًا، وَأَمَامِي نُورًا، وَخَلْفِي نُورًا، وَاجْعَلْ لِي نُورًا ‏", "narrator": "Narrated Ibn `Abbas:", "en": "One night I slept at the house of Maimuna. The Prophet (ﷺ) woke up, answered the call of nature, washed his face and hands, and then slept. He got up (late at night), went to a water skin, opened the mouth thereof and performed ablution not using much water, yet he washed all the parts properly and then offered the prayer. I got up and straightened my back in order that the Prophet (ﷺ) might not feel that I was watching him, and then I performed the ablution, and when he got up to offer the prayer, I stood on his left. He caught hold of my ear and brought me over to his right side. He offered thirteen rak`at in all and then lay down and slept till he started blowing out his breath as he used to do when he slept. In the meantime Bilal informed the Prophet (ﷺ) of the approaching time for the (Fajr) prayer, and the Prophet (ﷺ) offered the Fajr (Morning) prayer without performing new ablution. He used to say in his invocation, Allahumma ij`al fi qalbi nuran wa fi basari nuran, wa fi sam`i nuran, wa`an yamini nuran, wa`an yasari nuran, wa fawqi nuran, wa tahti nuran, wa amami nuran, wa khalfi nuran, waj`al li nuran.\" Kuraib (a sub narrator) said, \"I have forgotten seven other words, (which the Prophet (ﷺ) mentioned in this invocation). I met a man from the offspring of Al-`Abbas and he narrated those seven things to me, mentioning, '(Let there be light in) my nerves, my flesh, my blood, my hair and my body,' and he also mentioned two other things.\"", "grade": "Sahih", "match": 0.38}, "Jami‘ at-Tirmidhi 1956": {"ref": "Jami‘ at-Tirmidhi 1956", "url": "https://sunnah.com/tirmidhi:1956", "ar": "‏ تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ وَأَمْرُكَ بِالْمَعْرُوفِ وَنَهْيُكَ عَنِ الْمُنْكَرِ صَدَقَةٌ وَإِرْشَادُكَ الرَّجُلَ فِي أَرْضِ الضَّلاَلِ لَكَ صَدَقَةٌ وَبَصَرُكَ لِلرَّجُلِ الرَّدِيءِ الْبَصَرِ لَكَ صَدَقَةٌ وَإِمَاطَتُكَ الْحَجَرَ وَالشَّوْكَةَ وَالْعَظْمَ عَنِ الطَّرِيقِ لَكَ صَدَقَةٌ وَإِفْرَاغُكَ مِنْ دَلْوِكَ فِي دَلْوِ أَخِيكَ لَكَ صَدَقَةٌ ‏", "narrator": "Abu Dharr narrated that the Messenger of Allah said :", "en": "\"Your smiling in the face of your brother is charity, commanding good and forbidding evil is charity, your giving directions to a man lost in the land is charity for you. Your seeing for a man with bad sight is a charity for you, your removal of a rock, a thorn or a bone from the road is charity for you. Your pouring what remains from your bucket into the bucket of your brother is charity for you.\"", "grade": "Hasan (Darussalam) ", "match": 0.75}, "Sahih al-Bukhari 6464": {"ref": "Sahih al-Bukhari 6464", "url": "https://sunnah.com/bukhari:6464", "ar": "‏ سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الْجَنَّةَ، وَأَنَّ أَحَبَّ الأَعْمَالِ أَدْوَمُهَا إِلَى اللَّهِ، وَإِنْ قَلَّ ‏", "narrator": "Narrated `Aisha:", "en": "Allah's Messenger (ﷺ) said, \"Do good deeds properly, sincerely and moderately and know that your deeds will not make you enter Paradise, and that the most beloved deed to Allah is the most regular and constant even if it were little.\"", "grade": "Sahih", "match": 0.5}, "Sahih Muslim 2759": {"ref": "Sahih Muslim 2759 a, b", "url": "https://sunnah.com/muslim:2759a,b", "ar": "‏ إِنَّ\nاللَّهَ عَزَّ وَجَلَّ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ\nاللَّيْلِ حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا ‏", "narrator": "", "en": "Abu Musa reported Allah's Messenger (ﷺ) as saying that Allah, the Exalted and Glorious, Stretches out His Hand during the night so that the people may repent for the fault committed from dawn till dusk and He stretches out His Hand during the day so that the people may repent for the fault committed from dusk to dawn. (He would accept repentance) before the sun rises in the west (before the Day of Resurrection). A hadith like this has been narrated on the authority of Shu'ba with the same chain of transmitters.", "grade": "Sahih", "match": 0.73}, "Sahih Muslim 408": {"ref": "Sahih Muslim 408", "url": "https://sunnah.com/muslim:408", "ar": "‏ مَنْ صَلَّى عَلَىَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا ‏", "narrator": "Abu Huraira reported:", "en": "The Messenger of Allah (ﷺ) said: He who blesses me once, Allah would bless him ten times.", "grade": "Sahih", "match": 0.33}, "Jami‘ at-Tirmidhi 2910": {"ref": "Jami‘ at-Tirmidhi 2910", "url": "https://sunnah.com/tirmidhi:2910", "ar": "‏ مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللَّهِ فَلَهُ بِهِ حَسَنَةٌ وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا لاَ أَقُولُ الم حَرْفٌ وَلَكِنْ أَلِفٌ حَرْفٌ وَلاَمٌ حَرْفٌ وَمِيمٌ حَرْفٌ ‏", "narrator": "Narrated Muhammad bin Ka'b Al-Qurazi:", "en": "\"I heard 'Abdullah bin Mas'ud saying: 'The Messenger of Allah (ﷺ) said: \"[Whoever recites a letter] from Allah's Book, then he receives the reward from it, and the reward of ten the like of it. I do not say that Alif Lam Mim is a letter, but Alif is a letter, Lam is a letter and Mim is a letter.\"", "grade": "Hasan (Darussalam) ", "match": 0.5}, "Sahih al-Bukhari 1904": {"ref": "Sahih al-Bukhari 1904", "url": "https://sunnah.com/bukhari:1904", "ar": "‏ قَالَ اللَّهُ كُلُّ عَمَلِ ابْنِ آدَمَ لَهُ إِلاَّ الصِّيَامَ، فَإِنَّهُ لِي، وَأَنَا أَجْزِي بِهِ‏.‏ وَالصِّيَامُ جُنَّةٌ، وَإِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ، فَلاَ يَرْفُثْ وَلاَ يَصْخَبْ، فَإِنْ سَابَّهُ أَحَدٌ، أَوْ قَاتَلَهُ فَلْيَقُلْ إِنِّي امْرُؤٌ صَائِمٌ‏.‏ وَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ مِنْ رِيحِ الْمِسْكِ، لِلصَّائِمِ فَرْحَتَانِ يَفْرَحُهُمَا إِذَا أَفْطَرَ فَرِحَ، وَإِذَا لَقِيَ رَبَّهُ فَرِحَ بِصَوْمِهِ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"Allah said, 'All the deeds of Adam's sons (people) are for them, except fasting which is for Me, and I will give the reward for it.' Fasting is a shield or protection from the fire and from committing sins. If one of you is fasting, he should avoid sexual relation with his wife and quarreling, and if somebody should fight or quarrel with him, he should say, 'I am fasting.' By Him in Whose Hands my soul is' The unpleasant smell coming out from the mouth of a fasting person is better in the sight of Allah than the smell of musk. There are two pleasures for the fasting person, one at the time of breaking his fast, and the other at the time when he will meet his Lord; then he will be pleased because of his fasting.\"", "grade": "Sahih", "match": 0.67}, "Sahih al-Bukhari 528": {"ref": "Sahih al-Bukhari 528", "url": "https://sunnah.com/bukhari:528", "ar": "حَدَّثَنَا إِبْرَاهِيمُ بْنُ حَمْزَةَ، قَالَ حَدَّثَنِي ابْنُ أَبِي حَازِمٍ، وَالدَّرَاوَرْدِيُّ، عَنْ يَزِيدَ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ أَرَأَيْتُمْ لَوْ أَنَّ نَهَرًا بِبَابِ أَحَدِكُمْ، يَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسًا، مَا تَقُولُ ذَلِكَ يُبْقِي مِنْ دَرَنِهِ ‏\"‏‏.‏ قَالُوا لاَ يُبْقِي مِنْ دَرَنِهِ شَيْئًا‏.‏ قَالَ ‏\"‏ فَذَلِكَ مِثْلُ الصَّلَوَاتِ الْخَمْسِ، يَمْحُو اللَّهُ بِهَا الْخَطَايَا ‏\"‏‏.‏", "narrator": "Narrated Abu Huraira:", "en": "I heard Allah's Messenger (ﷺ) saying, \"If there was a river at the door of anyone of you and he took a bath in it five times a day would you notice any dirt on him?\" They said, \"Not a trace of dirt would be left.\" The Prophet (ﷺ) added, \"That is the example of the five prayers with which Allah blots out (annuls) evil deeds.\"", "grade": "Sahih", "match": 0.5}, "Sahih Muslim 2999": {"ref": "Sahih Muslim 2999", "url": "https://sunnah.com/muslim:2999", "ar": "‏ عَجَبًا لأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ وَلَيْسَ\nذَاكَ لأَحَدٍ إِلاَّ لِلْمُؤْمِنِ إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ\nخَيْرًا لَهُ ‏", "narrator": "Suhaib reported that Allah's Messenger (ﷺ) said:", "en": "Strange are the ways of a believer for there is good in every affair of his and this is not the case with anyone else except in the case of a believer for if he has an occasion to feel delight, he thanks (God), thus there is a good for him in it, and if he gets into trouble and shows resignation (and endures it patiently), there is a good for him in it.", "grade": "Sahih", "match": 0.38}, "Jami‘ at-Tirmidhi 2516": {"ref": "Jami‘ at-Tirmidhi 2516", "url": "https://sunnah.com/tirmidhi:2516", "ar": "‏ يَا غُلاَمُ إِنِّي أُعَلِّمُكَ كَلِمَاتٍ احْفَظِ اللَّهَ يَحْفَظْكَ احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ وَاعْلَمْ أَنَّ الأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَيْءٍ لَمْ يَنْفَعُوكَ إِلاَّ بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ وَلَوِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَيْءٍ لَمْ يَضُرُّوكَ إِلاَّ بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ رُفِعَتِ الأَقْلاَمُ وَجَفَّتِ الصُّحُفُ ‏", "narrator": "Ibn 'Abbas narrated:", "en": "\"I was behind the Prophet(ﷺ) one day when he said: 'O boy! I will teach you a statement: Be mindful of Allah and He will protect you. Be mindful of Allah and you will find Him before you. When you ask, ask Allah, and when you seek aid, seek Allah's aid. Know that if the entire creation were to gather together to do something to benefit you- you would never get any benefit except that Allah had written for you. And if they were to gather to do something to harm you- you would never be harmed except that Allah had written for you. The pens are lifted and the pages are dried.'\"", "grade": "Hasan (Darussalam) ", "match": 0.44}, "Sahih al-Bukhari 335": {"ref": "Sahih al-Bukhari 335", "url": "https://sunnah.com/bukhari:335", "ar": "‏ أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ قَبْلِي نُصِرْتُ بِالرُّعْبِ مَسِيرَةَ شَهْرٍ، وَجُعِلَتْ لِيَ الأَرْضُ مَسْجِدًا وَطَهُورًا، فَأَيُّمَا رَجُلٍ مِنْ أُمَّتِي أَدْرَكَتْهُ الصَّلاَةُ فَلْيُصَلِّ، وَأُحِلَّتْ لِيَ الْمَغَانِمُ وَلَمْ تَحِلَّ لأَحَدٍ قَبْلِي، وَأُعْطِيتُ الشَّفَاعَةَ، وَكَانَ النَّبِيُّ يُبْعَثُ إِلَى قَوْمِهِ خَاصَّةً، وَبُعِثْتُ إِلَى النَّاسِ عَامَّةً ‏", "narrator": "Narrated Jabir bin `Abdullah:", "en": "The Prophet (ﷺ) said, \"I have been given five things which were not given to any one else before me. -1. Allah made me victorious by awe, (by His frightening my enemies) for a distance of one month's journey. -2. The earth has been made for me (and for my followers) a place for praying and a thing to perform Tayammum, therefore anyone of my followers can pray wherever the time of a prayer is due. -3. The booty has been made Halal (lawful) for me yet it was not lawful for anyone else before me. -4. I have been given the right of intercession (on the Day of Resurrection). -5. Every Prophet (ﷺ) used to be sent to his nation only but I have been sent to all mankind.", "grade": "Sahih", "match": 0.71}, "Sahih Muslim 757": {"ref": "Sahih Muslim 757 a", "url": "https://sunnah.com/muslim:757a", "ar": "‏ إِنَّ فِي اللَّيْلِ لَسَاعَةً لاَ يُوَافِقُهَا رَجُلٌ مُسْلِمٌ يَسْأَلُ اللَّهَ خَيْرًا مِنْ أَمْرِ الدُّنْيَا وَالآخِرَةِ إِلاَّ أَعْطَاهُ إِيَّاهُ وَذَلِكَ كُلَّ لَيْلَةٍ ‏", "narrator": "Jabir said he heard Allah's Messenger (ﷺ) say:", "en": "There is an hour during the night in which no Muslim individual will ask Allah for good in this world and the next without His giving it to him; and that applies to every night.", "grade": "Sahih", "match": 0.7}, "Sahih al-Bukhari 5304": {"ref": "Sahih al-Bukhari 5304", "url": "https://sunnah.com/bukhari:5304", "ar": "‏ أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا ‏", "narrator": "Narrated Sahl:", "en": "Allah's Messenger (ﷺ) said, \"I and the one who looks after an orphan will be like this in Paradise,\" showing his middle and index fingers and separating them.", "grade": "Sahih", "match": 0.8}, "Sahih al-Bukhari 6018": {"ref": "Sahih al-Bukhari 6018", "url": "https://sunnah.com/bukhari:6018", "ar": "‏ مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"Anybody who believes in Allah and the Last Day should not harm his neighbor, and anybody who believes in Allah and the Last Day should entertain his guest generously and anybody who believes in Allah and the Last Day should talk what is good or keep quiet. (i.e. abstain from all kinds of evil and dirty talk).", "grade": "Sahih", "match": 0.43}, "Jami‘ at-Tirmidhi 3462": {"ref": "Jami‘ at-Tirmidhi 3462", "url": "https://sunnah.com/tirmidhi:3462", "ar": "‏ لَقِيتُ إِبْرَاهِيمَ لَيْلَةَ أُسْرِيَ بِي فَقَالَ يَا مُحَمَّدُ أَقْرِئْ أُمَّتَكَ مِنِّي السَّلاَمَ وَأَخْبِرْهُمْ أَنَّ الْجَنَّةَ طَيِّبَةُ التُّرْبَةِ عَذْبَةُ الْمَاءِ وَأَنَّهَا قِيعَانٌ وَأَنَّ غِرَاسَهَا سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ ‏", "narrator": "Ibn Mas`ud narrated that:", "en": "The Messenger of Allah (ﷺ) said: “I met Ibrahim on the night of my ascent, so he said: ‘O Muhammad, recite Salam from me to your nation, and inform them that Paradise has pure soil and delicious water, and that it is a flat treeless plain, and that its seeds are: “Glory is to Allah (Subḥān Allāh) [and] all praise is due to Allah (Al-ḥamdulillāh) and ‘none has the right to be worshipped but Allah’ (Lā ilāha illallāh), and Allah is the greatest (Allāhu Akbar).”", "grade": "Da’if (Darussalam) ", "match": 0.42}, "Sahih Muslim 597": {"ref": "Sahih Muslim 597 a", "url": "https://sunnah.com/muslim:597a", "ar": "‏ مَنْ سَبَّحَ اللَّهَ فِي دُبُرِ كُلِّ صَلاَةٍ ثَلاَثًا وَثَلاَثِينَ وَحَمِدَ اللَّهَ ثَلاَثًا وَثَلاَثِينَ وَكَبَّرَ اللَّهَ ثَلاَثًا وَثَلاَثِينَ فَتِلْكَ تِسْعَةٌ وَتِسْعُونَ وَقَالَ تَمَامَ الْمِائَةِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ ‏", "narrator": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:", "en": "If anyone extols Allah after every prayer thirty-three times, and praises Allah thirty-three times, and declares His Greatness thirty-three times, ninety-nine times in all, and says to complete a hundred:\" There is no god but Allah, having no partner with Him, to Him belongs sovereignty and to Him is praise due, and He is Potent over everything,\" his sins will be forgiven even If these are as abundant as the foam of the sea.", "grade": "Sahih", "match": 0.39}, "Sunan Abi Dawud 5082": {"ref": "Sunan Abi Dawud 5082", "url": "https://sunnah.com/abudawud:5082", "ar": "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُصَفَّى، حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ، قَالَ أَخْبَرَنِي ابْنُ أَبِي ذِئْبٍ، عَنْ أَبِي أَسِيدٍ الْبَرَّادِ، عَنْ مُعَاذِ بْنِ عَبْدِ اللَّهِ بْنِ خُبَيْبٍ، عَنْ أَبِيهِ، أَنَّهُ قَالَ خَرَجْنَا فِي لَيْلَةِ مَطَرٍ وَظُلْمَةٍ شَدِيدَةٍ نَطْلُبُ رَسُولَ اللَّهِ صلى الله عليه وسلم لِيُصَلِّيَ لَنَا فَأَدْرَكْنَاهُ فَقَالَ ‏\"‏ أَصَلَّيْتُمْ ‏\"‏ ‏.‏ فَلَمْ أَقُلْ شَيْئًا فَقَالَ ‏\"‏ قُلْ ‏\"‏ ‏.‏ فَلَمْ أَقُلْ شَيْئًا ثُمَّ قَالَ ‏\"‏ قُلْ ‏\"‏ ‏.‏ فَلَمْ أَقُلْ شَيْئًا ثُمَّ قَالَ ‏\"‏ قُلْ ‏\"‏ ‏.‏ فَقُلْتُ يَا رَسُولَ اللَّهِ مَا أَقُولُ قَالَ ‏\"‏ ‏{‏ قُلْ هُوَ اللَّهُ أَحَدٌ ‏}‏ وَالْمُعَوِّذَتَيْنِ حِينَ تُمْسِي وَحِينَ تُصْبِحُ ثَلاَثَ مَرَّاتٍ تَكْفِيكَ مِنْ كُلِّ شَىْءٍ ‏\"‏ ‏.‏", "narrator": "Narrated Abdullah ibn Khubayb:", "en": "We went out one rainy and intensely dark night to look for the Messenger of Allah (ﷺ) to lead us in prayer, and when we found him, he asked: Have you prayed?, but I did not say anything. So he said: Say, but I did not say anything. He again said: Say, but I did not say anything. He then said: Say. So I said: What am I to say? He said: Say: \"Say, He is Allah, One,\" and al-Mu'awwadhatan three times in the morning and evening; they will serve you for every purpose.", "grade": "Hasan (Al-Albani) ", "match": 0.33}, "Sahih al-Bukhari 6403": {"ref": "Sahih al-Bukhari 6403", "url": "https://sunnah.com/bukhari:6403", "ar": "‏ مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهْوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ‏.‏ فِي يَوْمٍ مِائَةَ مَرَّةٍ، كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَ لَهُ مِائَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ يَوْمَهُ ذَلِكَ، حَتَّى يُمْسِيَ، وَلَمْ يَأْتِ أَحَدٌ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلاَّ رَجُلٌ عَمِلَ أَكْثَرَ مِنْهُ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said,\" Whoever says: \"La ilaha illal-lah wahdahu la sharika lahu, lahu-l-mulk wa lahul- hamd wa huwa 'ala kulli shai'in qadir,\" one hundred times will get the same reward as given for manumitting ten slaves; and one hundred good deeds will be written in his accounts, and one hundred sins will be deducted from his accounts, and it (his saying) will be a shield for him from Satan on that day till night, and nobody will be able to do a better deed except the one who does more than he.\"", "grade": "Sahih", "match": 0.58}, "Jami‘ at-Tirmidhi 3383": {"ref": "Jami‘ at-Tirmidhi 3383", "url": "https://sunnah.com/tirmidhi:3383", "ar": "‏ أَفْضَلُ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ ‏", "narrator": "Jabir bin `Abdullah (ra) narrated that :", "en": "the Messenger of Allah (ﷺ) said: “The best remembrance is: ‘there is none worthy of worship except Allah (Lā ilāha illallāh)’ and the best supplication is: ‘All praise is due to Allah (Al-ḥamdulillāh).’”", "grade": "Hasan (Darussalam) ", "match": 0.5}, "Sahih al-Bukhari 6405": {"ref": "Sahih al-Bukhari 6405", "url": "https://sunnah.com/bukhari:6405", "ar": "‏ مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ‏.‏ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ، وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"Whoever says, 'Subhan Allah wa bihamdihi,' one hundred times a day, will be forgiven all his sins even if they were as much as the foam of the sea.", "grade": "Sahih", "match": 0.8}, "Sahih al-Bukhari 6682": {"ref": "Sahih al-Bukhari 6682", "url": "https://sunnah.com/bukhari:6682", "ar": "‏ كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ ‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"(The following are) two words (sentences or utterances) that are very easy for the tongue to say, and very heavy in the balance (of reward), and most beloved to the Gracious Almighty (And they are): Subhan Allahi wa bi-hamdihi; Subhan Allahi-l-'Adhim,\"", "grade": "Sahih", "match": 0.42}, "Sahih Muslim 2137": {"ref": "Sahih Muslim 2137 a", "url": "https://sunnah.com/muslim:2137a", "ar": "أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ‏.‏ لاَ يَضُرُّكَ بَأَيِّهِنَّ بَدَأْتَ.‏ وَلاَ تُسَمِّيَنَّ غُلاَمَكَ يَسَارًا وَلاَ رَبَاحًا وَلاَ نَجِيحًا وَلاَ أَفْلَحَ فَإِنَّكَ تَقُولُ أَثَمَّ هُوَ فَلاَ يَكُونُ فَيَقُولُ لاَ‏.", "narrator": "Samura b. Jundub reported:", "en": "The Messenger of Allah (peace and blessings of Allah be upon him) said \"The dearest phrases to Allah are four: Subhan Allah (Hallowed be Allah), Al-Hamdulillah (Praise be to Allah), La ilaha illa-Allah (There is no deity but Allah), Allahu Akbar (Allah is Greater). There is no harm for you in which of them begin with (while remembering Allah). And do not give these names to your servants: Yasar and Rabah and Najih and Aflah.", "grade": "Sahih", "match": 0.38}, "Sahih al-Bukhari 6384": {"ref": "Sahih al-Bukhari 6384", "url": "https://sunnah.com/bukhari:6384", "ar": "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ أَبِي عُثْمَانَ، عَنْ أَبِي مُوسَى ـ رضى الله عنه ـ قَالَ كُنَّا مَعَ النَّبِيِّ صلى الله عليه وسلم فِي سَفَرٍ فَكُنَّا إِذَا عَلَوْنَا كَبَّرْنَا فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ أَيُّهَا النَّاسُ ارْبَعُوا عَلَى أَنْفُسِكُمْ، فَإِنَّكُمْ لاَ تَدْعُونَ أَصَمَّ وَلاَ غَائِبًا، وَلَكِنْ تَدْعُونَ سَمِيعًا بَصِيرًا ‏\"‏‏.‏ ثُمَّ أَتَى عَلَىَّ وَأَنَا أَقُولُ فِي نَفْسِي لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ‏.‏ فَقَالَ ‏\"‏ يَا عَبْدَ اللَّهِ بْنَ قَيْسٍ قُلْ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ فَإِنَّهَا‏.‏ كَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ ‏\"‏‏.‏ أَوْ قَالَ ‏\"‏ أَلاَ أَدُلُّكَ عَلَى كَلِمَةٍ هِيَ كَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ ‏\"‏‏.‏", "narrator": "Narrated Abu Musa:", "en": "We were in the company of the Prophet (ﷺ) on a journey, and whenever we ascended a high place, we used to say Takbir (in a loud voice). The Prophet (ﷺ) said, \"O people! Be kind to yourselves, for you are not calling upon a deaf or an absent one, but You are calling an All-Hearer, and an All-Seer.\" Then he came to me as I was reciting silently, \"La haul a wala quwwata illa bil-lah.\" He said, \"O `Abdullah bin Qais! Say: La haul a walaquwata illa bil-lah, for it is one of the treasures of Paradise.\" Or he said, \"Shall I tell you a word which is one of the treasures of Paradise? It is: La haul a wala quwwata illa bil-lah.\"", "grade": "Sahih", "match": 0.64}, "Sahih Muslim 2726": {"ref": "Sahih Muslim 2726 a", "url": "https://sunnah.com/muslim:2726a", "ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، وَعَمْرٌو النَّاقِدُ، وَابْنُ أَبِي عُمَرَ، - وَاللَّفْظُ لاِبْنِ أَبِي عُمَرَ\n- قَالُوا حَدَّثَنَا سُفْيَانُ، عَنْ مُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ، مَوْلَى آلِ طَلْحَةَ عَنْ كُرَيْبٍ، عَنِ ابْنِ عَبَّاسٍ،\nعَنْ جُوَيْرِيَةَ، أَنَّ النَّبِيَّ صلى الله عليه وسلم خَرَجَ مِنْ عِنْدِهَا بُكْرَةً حِينَ صَلَّى الصُّبْحَ وَهِيَ\nفِي مَسْجِدِهَا ثُمَّ رَجَعَ بَعْدَ أَنْ أَضْحَى وَهِيَ جَالِسَةٌ فَقَالَ ‏\"‏ مَا زِلْتِ عَلَى الْحَالِ الَّتِي فَارَقْتُكِ\nعَلَيْهَا ‏\"‏ ‏.‏ قَالَتْ نَعَمْ ‏.‏ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ لَقَدْ قُلْتُ بَعْدَكِ أَرْبَعَ كَلِمَاتٍ ثَلاَثَ\nمَرَّاتٍ لَوْ وُزِنَتْ بِمَا قُلْتِ مُنْذُ الْيَوْمِ لَوَزَنَتْهُنَّ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ\nوَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ ‏\"‏ ‏.‏", "narrator": "Juwairiya reported that Allah's Messenger (ﷺ) came out from (her apartment) in the morning as she was busy in observing her dawn prayer in her place of worship. He came back in the forenoon and she was still sitting there. He (the Prophet) said to her:", "en": "You have been in the same seat since I left you. She said: Yes. Thereupon Allah's Messenger (ﷺ) said: I recited four words three times after I left you and if these are to be weighed against what you have recited since morning these would outweigh them and (these words) are:\" Hallowed be Allah and praise is due to Him according to the number of His creation and according to the pleasure of His Self and according to the weight of His Throne and according to the ink (used in recording) words (for His Praise).\"", "grade": "Sahih", "match": 0.44}, "Sahih Muslim 2702": {"ref": "Sahih Muslim 2702 b", "url": "https://sunnah.com/muslim:2702b", "ar": "‏ يَا أَيُّهَا النَّاسُ تُوبُوا إِلَى اللَّهِ فَإِنِّي أَتُوبُ\nفِي الْيَوْمِ إِلَيْهِ مِائَةَ مَرَّةٍ ‏", "narrator": "Al-Agharr al-Muzani who was from amongst the Companions of Allah's Messenger (ﷺ) reported that Ibn 'Umar stated to him that Allah's Messenger (may peace 'be upon him) said:", "en": "O people, seek repentance from Allah. Verily, I seek repentance from Him a hundred times a day.", "grade": "Sahih", "match": 0.8}, "Sahih al-Bukhari 6307": {"ref": "Sahih al-Bukhari 6307", "url": "https://sunnah.com/bukhari:6307", "ar": "‏ وَاللَّهِ إِنِّي لأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً ‏", "narrator": "Narrated Abu Huraira:", "en": "I heard Allah's Messenger (ﷺ) saying.\" By Allah! I ask for forgiveness from Allah and turn to Him in repentance more than seventy times a day.\"", "grade": "Sahih", "match": 0.86}, "Sahih al-Bukhari 6306": {"ref": "Sahih al-Bukhari 6306", "url": "https://sunnah.com/bukhari:6306", "ar": "حَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا الْحُسَيْنُ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ بُشَيْرِ بْنِ كَعْبٍ الْعَدَوِيِّ، قَالَ حَدَّثَنِي شَدَّادُ بْنُ أَوْسٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم ‏\"‏ سَيِّدُ الاِسْتِغْفَارِ أَنْ تَقُولَ اللَّهُمَّ أَنْتَ رَبِّي، لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَىَّ وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ ‏\"‏‏.‏ قَالَ ‏\"‏ وَمَنْ قَالَهَا مِنَ النَّهَارِ مُوقِنًا بِهَا، فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ، فَهُوَ مِنْ أَهْلِ الْجَنَّةِ، وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهْوَ مُوقِنٌ بِهَا، فَمَاتَ قَبْلَ أَنْ يُصْبِحَ، فَهْوَ مِنْ أَهْلِ الْجَنَّةِ ‏\"‏‏.‏", "narrator": "Narrated Shaddad bin Aus:", "en": "The Prophet (ﷺ) said \"The most superior way of asking for forgiveness from Allah is: 'Allahumma anta Rabbi la ilaha illa anta, Khalaqtani wa ana `Abduka, wa ana `ala `ahdika wa wa`dika mastata`tu, A`udhu bika min Sharri ma sana`tu, abu'u Laka bini`matika `alaiya, wa abu'u laka bidhanbi faghfir lee fa innahu la yaghfiru adhdhunuba illa anta.\" The Prophet (ﷺ) added. \"If somebody recites it during the day with firm faith in it, and dies on the same day before the evening, he will be from the people of Paradise; and if somebody recites it at night with firm faith in it, and dies before the morning, he will be from the people of Paradise.\"", "grade": "Sahih", "match": 0.73}, "Jami‘ at-Tirmidhi 3513": {"ref": "Jami‘ at-Tirmidhi 3513", "url": "https://sunnah.com/tirmidhi:3513", "ar": "‏ قُولِي اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي ‏", "narrator": "Aishah narrated:", "en": "“I said: ‘O Messenger of Allah, what is your view if I know when the Night of Al-Qadr is, then what should I say in it?” He said: ‘Say: “O Allah, indeed You are Pardoning, [Generous,] You love pardon, so pardon me (Allāhumma innaka `Afuwwun [Karīmun], tuḥibbul-`afwa fa`fu `annī).’”", "grade": "Sahih (Darussalam) ", "match": 0.54}, "Jami‘ at-Tirmidhi 3505": {"ref": "Jami‘ at-Tirmidhi 3505", "url": "https://sunnah.com/tirmidhi:3505", "ar": "‏ دَعْوَةُ ذِي النُّونِ إِذْ دَعَا وَهُوَ فِي بَطْنِ الْحُوتِ لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ ‏.‏ فَإِنَّهُ لَمْ يَدْعُ بِهَا رَجُلٌ مُسْلِمٌ فِي شَيْءٍ قَطُّ إِلاَّ اسْتَجَابَ اللَّهُ لَهُ ‏", "narrator": "Ibrahim bin Muhammad bin Sa`d narrated from his father, from Sa`d that the Messenger of Allah (ﷺ) said:", "en": "“The supplication of Dhun-Nun (Prophet (ﷺ) Yunus) when he supplicated, while in the belly of the whale was: ‘There is none worthy of worship except You, Glory to You, Indeed, I have been of the transgressors. (Lā ilāha illā anta subḥānaka innī kuntu minaẓ-ẓālimīn)’ So indeed, no Muslim man supplicates with it for anything, ever, except Allah responds to him.”", "grade": "Sahih (Darussalam) ", "match": 0.55}, "Sunan Abi Dawud 5088": {"ref": "Sunan Abi Dawud 5088", "url": "https://sunnah.com/abudawud:5088", "ar": "‏ مَنْ قَالَ بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَىْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ ثَلاَثَ مَرَّاتٍ لَمْ تُصِبْهُ فَجْأَةُ بَلاَءٍ حَتَّى يُصْبِحَ وَمَنْ قَالَهَا حِينَ يُصْبِحُ ثَلاَثَ مَرَّاتٍ لَمْ تُصِبْهُ فَجْأَةُ بَلاَءٍ حَتَّى يُمْسِيَ ‏", "narrator": "Narrated Uthman ibn Affan:", "en": "Aban ibn Uthman said: I heard Uthman ibn Affan (his father) say: I heard the Messenger of Allah (ﷺ) say: If anyone says three times: \"In the name of Allah, when Whose name is mentioned nothing on Earth or in Heaven can cause harm, and He is the Hearer, the Knower\" he will not suffer sudden affliction till the morning, and if anyone says this in the morning, he will not suffer sudden affliction till the evening. Aban was afflicted by some paralysis and when a man who heard the tradition began to look at him, he said to him: Why are you looking at me? I swear by Allah, I did not tell a lie about Uthman, nor did Uthman tell a lie about the Prophet (ﷺ), but that day when I was afflicted by it, I became angry and forgot to say them.", "grade": "Sahih (Al-Albani) ", "match": 0.35}, "Sunan Abi Dawud 5072": {"ref": "Sunan Abi Dawud 5072", "url": "https://sunnah.com/abudawud:5072", "ar": "‏ مَنْ قَالَ إِذَا أَصْبَحَ وَإِذَا أَمْسَى رَضِينَا بِاللَّهِ رَبًّا وَبِالإِسْلاَمِ دِينًا وَبِمُحَمَّدٍ رَسُولاً إِلاَّ كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ ‏", "narrator": "Narrated A man:", "en": "AbuSallam told that he was in the mosque of Hims. A man passed him and the people said about him that he served the Prophet (ﷺ). He (AbuSallam) went to him and said: Tell me any tradition which you heard from the Messenger of Allah (ﷺ) and there were no man between him and you. He said: I heard the Messenger of Allah (ﷺ) say: If anyone says in the morning and in the evening: \"I am pleased with Allah as Lord, with Islam as religion, with Muhammad as Prophet,\" Allah will certainly please him.", "grade": "Da'if (Al-Albani) ", "match": 0.21}, "Sunan Abi Dawud 5081": {"ref": "Sunan Abi Dawud 5081", "url": "https://sunnah.com/abudawud:5081", "ar": "حَدَّثَنَا يَزِيدُ بْنُ مُحَمَّدٍ الدِّمَشْقِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ بْنُ مُسْلِمٍ الدِّمَشْقِيُّ، - وَكَانَ مِنْ ثِقَاتِ الْمُسْلِمِينَ مِنَ الْمُتَعَبِّدِينَ - قَالَ حَدَّثَنَا مُدْرِكُ بْنُ سَعْدٍ - قَالَ يَزِيدُ شَيْخٌ ثِقَةٌ - عَنْ يُونُسَ بْنِ مَيْسَرَةَ بْنِ حَلْبَسٍ عَنْ أُمِّ الدَّرْدَاءِ عَنْ أَبِي الدَّرْدَاءِ رضى الله عنه قَالَ مَنْ قَالَ إِذَا أَصْبَحَ وَإِذَا أَمْسَى حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ سَبْعَ مَرَّاتٍ كَفَاهُ اللَّهُ مَا أَهَمَّهُ صَادِقًا كَانَ بِهَا أَوْ كَاذِبًا ‏.‏", "narrator": "Abu al-Darda’ said:", "en": "if anyone says seven times morning and evening; “Allah sufficeth me: there is no god but He; on him is my trust- he, the Lord of the Throne (of glory) Supreme”, Allah will be sufficient for him against anything which grieves him, whether he is true or false in (repeating) them.", "grade": "Mawdu' (Fabricated) (Al-Albani) ", "match": 0.27}, "Sahih Muslim 2708": {"ref": "Sahih Muslim 2708 a", "url": "https://sunnah.com/muslim:2708a", "ar": "‏ مَنْ نَزَلَ مَنْزِلاً ثُمَّ قَالَ أَعُوذُ بِكَلِمَاتِ\nاللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ ‏.‏ لَمْ يَضُرُّهُ شَىْءٌ حَتَّى يَرْتَحِلَ مِنْ مَنْزِلِهِ ذَلِكَ ‏", "narrator": "Khaula bint Hakim Sulamiyya reported:", "en": "I heard Allah's Messenger (ﷺ) as saying: When anyone lands at a place, and then says:\" I seek refuge in the Perfect Word of Allah from the evil of what He has created,\" nothing would harm him until he marches from that stopping place.", "grade": "Sahih", "match": 0.33}, "Sahih al-Bukhari 4563": {"ref": "Sahih al-Bukhari 4563", "url": "https://sunnah.com/bukhari:4563", "ar": "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ ـ أُرَاهُ قَالَ ـ حَدَّثَنَا أَبُو بَكْرٍ، عَنْ أَبِي حَصِينٍ، عَنْ أَبِي الضُّحَى، عَنِ ابْنِ عَبَّاسٍ، ‏{‏حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ‏}‏ قَالَهَا إِبْرَاهِيمُ عَلَيْهِ السَّلاَمُ حِينَ أُلْقِيَ فِي النَّارِ، وَقَالَهَا مُحَمَّدٌ صلى الله عليه وسلم حِينَ قَالُوا ‏{‏إِنَّ النَّاسَ قَدْ جَمَعُوا لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمْ إِيمَانًا وَقَالُوا حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ‏}‏", "narrator": "Narrated Ibn `Abbas:", "en": "'Allah is Sufficient for us and He Is the Best Disposer of affairs,\" was said by Abraham when he was thrown into the fire; and it was said by Muhammad when they (i.e. hypocrites) said, \"A great army is gathering against you, therefore, fear them,\" but it only increased their faith and they said: \"Allah is Sufficient for us, and He is the Best Disposer (of affairs, for us).\" (3:173)", "grade": "Sahih", "match": 0.67}, "Jami‘ at-Tirmidhi 2140": {"ref": "Jami‘ at-Tirmidhi 2140", "url": "https://sunnah.com/tirmidhi:2140", "ar": "حَدَّثَنَا هَنَّادٌ، قال حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ أَنَسٍ، قَالَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُكْثِرُ أَنْ يَقُولَ ‏\"‏ يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ ‏\"‏ ‏.‏ فَقُلْتُ يَا رَسُولَ اللَّهِ آمَنَّا بِكَ وَبِمَا جِئْتَ بِهِ فَهَلْ تَخَافُ عَلَيْنَا قَالَ ‏\"‏ نَعَمْ إِنَّ الْقُلُوبَ بَيْنَ أَصْبُعَيْنِ مِنْ أَصَابِعِ اللَّهِ يُقَلِّبُهَا كَيْفَ يَشَاءُ ‏\"‏ ‏.‏ قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنِ النَّوَّاسِ بْنِ سَمْعَانَ وَأُمِّ سَلَمَةَ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو وَعَائِشَةَ ‏.‏ وَهَذَا حَدِيثٌ حَسَنٌ وَهَكَذَا رَوَى غَيْرُ وَاحِدٍ عَنِ الأَعْمَشِ عَنْ أَبِي سُفْيَانَ عَنْ أَنَسٍ ‏.‏ وَرَوَى بَعْضُهُمْ عَنِ الأَعْمَشِ عَنْ أَبِي سُفْيَانَ عَنْ جَابِرٍ عَنِ النَّبِيِّ صلى الله عليه وسلم ‏.‏ وَحَدِيثُ أَبِي سُفْيَانَ عَنْ أَنَسٍ أَصَحُّ ‏.‏", "narrator": "'Anas narrated:", "en": "\"The Messenger of Allah (ﷺ) would often say: Ya Muqallibal-qulub, thabbit qalbi 'ala dinik('O Changer of the Hearts! Strengthen my heart upon Your Religion.)' So I said: 'O Prophet (ﷺ) of Allah! We believe in you and what you have come with, but do you fear for us?' He said: 'Yes. Indeed the hearts are between two Fingers of Allah's Fingers, He changes them as He wills.'\"", "grade": "", "match": 0.73}, "Sunan Abi Dawud 1522": {"ref": "Sunan Abi Dawud 1522", "url": "https://sunnah.com/abudawud:1522", "ar": "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ بْنِ مَيْسَرَةَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَزِيدَ الْمُقْرِئُ، حَدَّثَنَا حَيْوَةُ بْنُ شُرَيْحٍ، قَالَ سَمِعْتُ عُقْبَةَ بْنَ مُسْلِمٍ، يَقُولُ حَدَّثَنِي أَبُو عَبْدِ الرَّحْمَنِ الْحُبُلِيُّ، عَنِ الصُّنَابِحِيِّ، عَنْ مُعَاذِ بْنِ جَبَلٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم أَخَذَ بِيَدِهِ وَقَالَ ‏\"‏ يَا مُعَاذُ وَاللَّهِ إِنِّي لأُحِبُّكَ وَاللَّهِ إِنِّي لأُحِبُّكَ ‏\"‏ ‏.‏ فَقَالَ ‏\"‏ أُوصِيكَ يَا مُعَاذُ لاَ تَدَعَنَّ فِي دُبُرِ كُلِّ صَلاَةٍ تَقُولُ اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ ع
